# Dependabot keeps the pinned actions and the JavaScript workspace
# current. Each ecosystem arrives as one grouped pull request, so a week
# of updates costs one review.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
      include: scope
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      javascript:
        patterns: ["*"]
    commit-message:
      prefix: build
      include: scope
