name: Publish VSCode Extension

# Publishes the VSIX of a stable release to Open VSX and to the Visual
# Studio Marketplace, byte for byte as the release holds it. ship.yml
# calls it, since a release that the workflow token creates starts no
# other workflow. A dry run of ship.yml calls it with `dry_run`, which
# checks the VSIX of the run and publishes nothing.
#
# The stores hold the extension under different publishers, lus on Open
# VSX and lus-language on the Marketplace, so a release carries one VSIX
# for each: lus-X.Y.Z.vsix and lus-X.Y.Z-marketplace.vsix. Each job checks
# the digest of its VSIX against SHA256SUMS and the publisher that its
# manifest names before it publishes.
#
# The marketplace job publishes with the trusted publishing of the
# Marketplace: vsce exchanges the OpenID Connect token of the job for a
# Marketplace credential that lasts 15 minutes, so the repository stores
# no Marketplace token. It runs in the environment marketplace, which has
# no reviewer and allows only the main and rewrite branches. It publishes
# only when that environment sets the variable MARKETPLACE_PUBLISHER to
# the publisher of the VSIX (packaging/release/README.md).

on:
  release:
    types: [published]
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      dry_run:
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      tag:
        description: "Stable release tag to publish, such as v2.0.0"
        required: true
        type: string

env:
  NODE_VERSION: "24.7.0"
  OVSX_VERSION: "0.10.9"

jobs:
  publish-vscode:
    name: Publish exact release VSIX
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      verified: ${{ steps.verify.outputs.verified }}
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Download the VSIX of the run
        if: ${{ inputs.dry_run == true }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-vscode
          path: run-assets
      - name: Download the checksums of the run
        if: ${{ inputs.dry_run == true }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ship-sums
          path: run-assets
      - name: Download and verify release publication inputs
        id: verify
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          DRY_RUN: ${{ inputs.dry_run == true }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "invalid stable release tag: $TAG" >&2
            exit 1
          fi
          version=${TAG#v}
          vsix="lus-$version.vsix"
          marketplace="lus-$version-marketplace.vsix"
          publisher="lus-$version-open-vsx-publisher.cjs"
          mkdir anchor candidate
          # A dry run has no tag yet. The release commit leaves the
          # manifest unchanged, so the commit of the run holds the same one.
          ref="$TAG"
          if [ "$DRY_RUN" = true ]; then ref="$GITHUB_SHA"; fi
          gh api \
            -H "Accept: application/vnd.github+json" \
            "repos/${{ github.repository }}/contents/packaging/release/manifest.json?ref=$ref" \
            --jq .content | base64 --decode > anchor/release-manifest.json
          test -s anchor/release-manifest.json
          expected_publisher_sha=$(node -e '
            const fs = require("node:fs");
            const value = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            const publisher = value.components?.vscodePublisher;
            if (
              value.schemaVersion !== 1 ||
              publisher?.asset !== "lus-{version}-open-vsx-publisher.cjs" ||
              !/^[0-9a-f]{64}$/.test(publisher?.sha256 ?? "")
            ) throw new Error("tagged publisher anchor is invalid");
            process.stdout.write(publisher.sha256);
          ' anchor/release-manifest.json)
          if [ "$DRY_RUN" = true ]; then
            cp "run-assets/$vsix" "run-assets/$marketplace" "run-assets/$publisher" run-assets/SHA256SUMS candidate/
          else
            gh release download "$TAG" \
              --repo "${{ github.repository }}" \
              --pattern "$vsix" \
              --pattern "$marketplace" \
              --pattern "$publisher" \
              --pattern SHA256SUMS \
              --dir candidate
          fi
          cd candidate
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 4
          test -s SHA256SUMS
          for name in "$vsix" "$marketplace" "$publisher"; do
            test -s "$name"
            test ! -L "$name"
          done
          : > PUBLISH-SUMS
          for name in "$vsix" "$marketplace" "$publisher"; do
            awk -v name="$name" '$2 == name { print }' SHA256SUMS > INPUT-SUM
            test "$(wc -l < INPUT-SUM)" -eq 1
            grep -Eq "^[0-9a-f]{64}  ${name//./[.]}$" INPUT-SUM
            cat INPUT-SUM >> PUBLISH-SUMS
          done
          sha256sum --check --strict PUBLISH-SUMS
          test "$(sha256sum "$publisher" | awk '{ print $1 }')" = "$expected_publisher_sha"
          chmod 0444 "$vsix" "$marketplace" "$publisher" PUBLISH-SUMS
          test "$(unzip -p "$vsix" extension/package.json | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).publisher')" = lus
          test "$(stat -c '%a' "$vsix")" = 444
          test "$(stat -c '%a' "$publisher")" = 444
          publisher_path="$PWD/$publisher"
          test "$(node "$publisher_path" --version)" = "$OVSX_VERSION"
          sha256sum --check --strict PUBLISH-SUMS
          test "$(sha256sum "$publisher" | awk '{ print $1 }')" = "$expected_publisher_sha"
          echo "VSIX_PATH=$PWD/$vsix" >> "$GITHUB_ENV"
          echo "PUBLISHER_PATH=$publisher_path" >> "$GITHUB_ENV"
          echo "PUBLISH_INPUTS_DIR=$PWD" >> "$GITHUB_ENV"
          echo "EXPECTED_PUBLISHER_SHA256=$expected_publisher_sha" >> "$GITHUB_ENV"
          echo "VSIX_SHA256=$(sha256sum "$vsix" | awk '{ print $1 }')" >> "$GITHUB_ENV"
          echo "PUBLISHER_SHA256=$(sha256sum "$publisher" | awk '{ print $1 }')" >> "$GITHUB_ENV"
          mkdir "$RUNNER_TEMP/verified"
          cp "$marketplace" "$RUNNER_TEMP/verified/"
          grep " $marketplace\$" PUBLISH-SUMS > "$RUNNER_TEMP/verified/VSIX-SUM"
          echo "verified=true" >> "$GITHUB_OUTPUT"
      # The marketplace job takes the Marketplace VSIX that this job
      # verified and checks it again. The upload comes before the publish
      # to Open VSX, so a failure of one store leaves the other to
      # publish.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vscode-verified
          path: ${{ runner.temp }}/verified/
          if-no-files-found: error
      - name: Publish the verified bytes to Open VSX
        if: ${{ inputs.dry_run != true }}
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: node "$PUBLISHER_PATH" "$VSIX_PATH"
      - name: Record published digest
        if: ${{ inputs.dry_run != true }}
        run: |
          cd "$PUBLISH_INPUTS_DIR"
          sha256sum --check --strict PUBLISH-SUMS
          test "$(sha256sum "$PUBLISHER_PATH" | awk '{ print $1 }')" = "$EXPECTED_PUBLISHER_SHA256"
          echo "Published Open VSX artifact SHA-256 $VSIX_SHA256 with publisher $PUBLISHER_SHA256" >> "$GITHUB_STEP_SUMMARY"

  marketplace:
    name: Publish exact release VSIX to the Visual Studio Marketplace
    needs: publish-vscode
    if: ${{ !cancelled() && needs.publish-vscode.outputs.verified == 'true' }}
    runs-on: ubuntu-24.04
    # The trusted publishing policies of the Marketplace name this
    # environment, so a token from a job outside it cannot publish.
    environment: ${{ inputs.dry_run != true && 'marketplace' || '' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          sparse-checkout: packaging/release/vsce
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: vscode-verified
          path: ${{ runner.temp }}/verified
      # package-lock.json pins vsce and each of its dependencies by digest.
      - name: Install vsce
        working-directory: packaging/release/vsce
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node_modules/.bin/vsce --version
      - name: Check the VSIX and the settings
        id: settings
        env:
          DRY_RUN: ${{ inputs.dry_run == true }}
          MARKETPLACE_PUBLISHER: ${{ vars.MARKETPLACE_PUBLISHER }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/verified"
          sha256sum --check --strict VSIX-SUM
          vsix="$(awk '{ print $2 }' VSIX-SUM)"
          publisher="$(unzip -p "$vsix" extension/package.json | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).publisher')"
          echo "VSIX_PATH=$PWD/$vsix" >> "$GITHUB_ENV"
          if [ "$DRY_RUN" = true ]; then
            echo "A release would publish $vsix of the publisher $publisher to the Visual Studio Marketplace." >> "$GITHUB_STEP_SUMMARY"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif [ -z "$MARKETPLACE_PUBLISHER" ]; then
            echo "::warning::$vsix is not published to the Visual Studio Marketplace, since the environment marketplace does not set MARKETPLACE_PUBLISHER"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif [ "$MARKETPLACE_PUBLISHER" != "$publisher" ]; then
            echo "::error::the VSIX names the publisher $publisher, and MARKETPLACE_PUBLISHER is $MARKETPLACE_PUBLISHER"
            exit 1
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish the verified bytes to the Visual Studio Marketplace
        if: steps.settings.outputs.publish == 'true'
        working-directory: packaging/release/vsce
        run: |
          set -euo pipefail
          # A rerun after a published version skips it.
          node_modules/.bin/vsce publish --oidc --skip-duplicate --packagePath "$VSIX_PATH"
          echo "Published $(basename "$VSIX_PATH") to the Visual Studio Marketplace" >> "$GITHUB_STEP_SUMMARY"
