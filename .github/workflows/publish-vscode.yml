name: Publish VSCode Extension

# Publishes the VSIX of a stable release to Open VSX, byte for byte as the
# release holds it. ship.yml calls it, since a release that the workflow
# token creates starts no other workflow. A dry run of ship.yml calls it
# with `dry_run`, which checks the VSIX of the run and publishes nothing.

on:
  release:
    types: [published]
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      dry_run:
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      tag:
        description: "Stable release tag to publish, such as v2.0.0"
        required: true
        type: string

env:
  NODE_VERSION: "24.7.0"
  OVSX_VERSION: "0.10.9"

jobs:
  publish-vscode:
    name: Publish exact release VSIX
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Download the VSIX of the run
        if: ${{ inputs.dry_run == true }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-vscode
          path: run-assets
      - name: Download the checksums of the run
        if: ${{ inputs.dry_run == true }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ship-sums
          path: run-assets
      - name: Download and verify release publication inputs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          DRY_RUN: ${{ inputs.dry_run == true }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "invalid stable release tag: $TAG" >&2
            exit 1
          fi
          version=${TAG#v}
          vsix="lus-$version.vsix"
          publisher="lus-$version-open-vsx-publisher.cjs"
          mkdir anchor candidate
          # A dry run has no tag yet, and the release commit leaves the
          # manifest as the commit of the run holds it.
          ref="$TAG"
          if [ "$DRY_RUN" = true ]; then ref="$GITHUB_SHA"; fi
          gh api \
            -H "Accept: application/vnd.github+json" \
            "repos/${{ github.repository }}/contents/packaging/release/manifest.json?ref=$ref" \
            --jq .content | base64 --decode > anchor/release-manifest.json
          test -s anchor/release-manifest.json
          expected_publisher_sha=$(node -e '
            const fs = require("node:fs");
            const value = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            const publisher = value.components?.vscodePublisher;
            if (
              value.schemaVersion !== 1 ||
              publisher?.asset !== "lus-{version}-open-vsx-publisher.cjs" ||
              !/^[0-9a-f]{64}$/.test(publisher?.sha256 ?? "")
            ) throw new Error("tagged publisher anchor is invalid");
            process.stdout.write(publisher.sha256);
          ' anchor/release-manifest.json)
          if [ "$DRY_RUN" = true ]; then
            cp "run-assets/$vsix" "run-assets/$publisher" run-assets/SHA256SUMS candidate/
          else
            gh release download "$TAG" \
              --repo "${{ github.repository }}" \
              --pattern "$vsix" \
              --pattern "$publisher" \
              --pattern SHA256SUMS \
              --dir candidate
          fi
          cd candidate
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 3
          test -s SHA256SUMS
          test -s "$vsix"
          test -s "$publisher"
          test ! -L "$vsix"
          test ! -L "$publisher"
          : > PUBLISH-SUMS
          for name in "$vsix" "$publisher"; do
            awk -v name="$name" '$2 == name { print }' SHA256SUMS > INPUT-SUM
            test "$(wc -l < INPUT-SUM)" -eq 1
            grep -Eq "^[0-9a-f]{64}  ${name//./[.]}$" INPUT-SUM
            cat INPUT-SUM >> PUBLISH-SUMS
          done
          sha256sum --check --strict PUBLISH-SUMS
          test "$(sha256sum "$publisher" | awk '{ print $1 }')" = "$expected_publisher_sha"
          chmod 0444 "$vsix" "$publisher" PUBLISH-SUMS
          test "$(stat -c '%a' "$vsix")" = 444
          test "$(stat -c '%a' "$publisher")" = 444
          publisher_path="$PWD/$publisher"
          test "$(node "$publisher_path" --version)" = "$OVSX_VERSION"
          sha256sum --check --strict PUBLISH-SUMS
          test "$(sha256sum "$publisher" | awk '{ print $1 }')" = "$expected_publisher_sha"
          echo "VSIX_PATH=$PWD/$vsix" >> "$GITHUB_ENV"
          echo "PUBLISHER_PATH=$publisher_path" >> "$GITHUB_ENV"
          echo "PUBLISH_INPUTS_DIR=$PWD" >> "$GITHUB_ENV"
          echo "EXPECTED_PUBLISHER_SHA256=$expected_publisher_sha" >> "$GITHUB_ENV"
          echo "VSIX_SHA256=$(sha256sum "$vsix" | awk '{ print $1 }')" >> "$GITHUB_ENV"
          echo "PUBLISHER_SHA256=$(sha256sum "$publisher" | awk '{ print $1 }')" >> "$GITHUB_ENV"
      - name: Publish the verified bytes to Open VSX
        if: ${{ inputs.dry_run != true }}
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: node "$PUBLISHER_PATH" "$VSIX_PATH"
      - name: Record published digest
        if: ${{ inputs.dry_run != true }}
        run: |
          cd "$PUBLISH_INPUTS_DIR"
          sha256sum --check --strict PUBLISH-SUMS
          test "$(sha256sum "$PUBLISHER_PATH" | awk '{ print $1 }')" = "$EXPECTED_PUBLISHER_SHA256"
          echo "Published Open VSX artifact SHA-256 $VSIX_SHA256 with publisher $PUBLISHER_SHA256" >> "$GITHUB_STEP_SUMMARY"
