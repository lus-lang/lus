name: CI

on:
  push:
    branches: [main, rewrite]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ZIG_VERSION: "0.17.1"
  NODE_VERSION: "24.7.0"
  PNPM_VERSION: "10.18.0"

jobs:
  lint:
    name: Lint and generated files
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Repository lint
        run: node tools/lint-repo.js
      - name: Generator tests
        run: node tools/build-lsp.test.js && node tools/build-grammar.test.js
      - name: Generated files are current
        run: node tools/build-lsp.js --check && node tools/build-grammar.js --check

  web:
    name: Site and VSCode extension
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install pnpm
        run: npm install --global "pnpm@$PNPM_VERSION"
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      - name: VSCode extension
        working-directory: packages/vscode
        run: pnpm typecheck && pnpm test && pnpm build
      - name: Site
        working-directory: packages/site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm test && pnpm build

  runtime:
    name: Runtime (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    # The step limits below add up to 255 minutes on Linux, which runs
    # every step. The job limit covers them and the setup steps, so a step
    # always reaches its own limit before the job is cancelled.
    timeout-minutes: 270
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Formatting
        timeout-minutes: 5
        if: runner.os == 'Linux'
        working-directory: runtime
        run: zig fmt --check src build.zig
      - name: Unit, embedding, and tool tests
        timeout-minutes: 30
        working-directory: runtime
        run: zig build test test-embed test-bundle test-check test-doc -Doptimize=ReleaseSafe
      - name: Debugger tests
        timeout-minutes: 15
        if: runner.os != 'Windows'
        working-directory: runtime
        run: zig build test-debug -Doptimize=ReleaseSafe
      - name: Version manager and remote module tests
        timeout-minutes: 15
        # The fixtures build POSIX release archives. Windows installs are
        # covered by the installer job of the release workflow.
        if: runner.os != 'Windows'
        working-directory: runtime
        run: zig build test-version test-remote -Doptimize=ReleaseSafe
      - name: Build
        timeout-minutes: 15
        working-directory: runtime
        run: zig build -Doptimize=ReleaseSafe
      - name: Cross builds for the emulated targets
        timeout-minutes: 15
        # The nightly workflow runs these targets under qemu-user. Every
        # change at least compiles for them.
        if: runner.os == 'Linux'
        working-directory: runtime
        run: |
          zig build -Doptimize=ReleaseSafe -Dtarget=riscv64-linux-musl --prefix zig-out-riscv64
          zig build -Doptimize=ReleaseSafe -Dtarget=loongarch64-linux-musl --prefix zig-out-loongarch64
          zig build -Doptimize=ReleaseSafe -Dtarget=powerpc64le-linux-musl --prefix zig-out-powerpc64le
      - name: Native code runs
        timeout-minutes: 5
        # Every runner of this job has the JIT. A silent fall back to the
        # interpreter would pass every other step.
        working-directory: runtime
        env:
          LUS_JIT: eager
        run: zig-out/bin/lus -e "local function f() end f() assert(debug.jit(f), 'no native code')"
      - name: Conformance tests
        timeout-minutes: 20
        working-directory: runtime
        run: zig-out/bin/lus test ../tests/conformance ../packages/language-server/tests
      - name: Conformance tests in native code
        timeout-minutes: 20
        # Every function compiles on its first call. A platform without
        # the JIT runs the suite interpreted once more.
        working-directory: runtime
        env:
          LUS_JIT: eager
        run: zig-out/bin/lus test ../tests/conformance ../packages/language-server/tests
      - name: Conformance tests interpreted
        timeout-minutes: 20
        working-directory: runtime
        env:
          LUS_JIT: "off"
        run: zig-out/bin/lus test ../tests/conformance ../packages/language-server/tests
      - name: Conformance tests in optimized code
        timeout-minutes: 20
        # Every function goes through both JIT tiers on its first call.
        working-directory: runtime
        env:
          LUS_JIT: opt-eager
        run: zig-out/bin/lus test ../tests/conformance ../packages/language-server/tests
      - name: Conformance tests in baseline code
        timeout-minutes: 20
        if: runner.os == 'Windows'
        working-directory: runtime
        env:
          LUS_JIT: baseline
        run: zig-out/bin/lus test ../tests/conformance ../packages/language-server/tests
      - name: Conformance tests with short chains of direct calls
        timeout-minutes: 20
        # Every chain of direct calls in optimized code ends after a few
        # activations, which exercises the exits and the stack probes.
        if: runner.os == 'Windows'
        working-directory: runtime
        env:
          LUS_JIT: opt-eager
          LUS_JIT_DIRECT: "1024"
        run: zig-out/bin/lus test ../tests/conformance
      - name: Documentation examples
        timeout-minutes: 10
        working-directory: runtime
        run: zig-out/bin/lus test --doc ../packages/site/src/manual ../spec
      - name: WebAssembly build
        timeout-minutes: 15
        if: runner.os == 'Linux'
        working-directory: runtime
        run: |
          zig build wasm
          mkdir -p ../packages/wasm/dist
          cp zig-out/wasm/lus.wasm ../packages/wasm/dist/lus.wasm
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: runner.os != 'Windows'
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Unix installer
        timeout-minutes: 10
        if: runner.os != 'Windows'
        run: node --test packaging/install/install.test.mjs
      - name: Differential tests
        timeout-minutes: 20
        # Generated programs must print the same under every JIT mode.
        if: runner.os != 'Windows'
        env:
          LUS_JIT: "off"
        run: runtime/zig-out/bin/lus tests/diff/run.lus --count 200 --start 1 --jobs 4 --timeout 120 --out "$RUNNER_TEMP/diff-findings"
      - name: Differential tests on Windows
        timeout-minutes: 15
        # A short run of the same programs through cmd.exe. Windows gives a
        # shell command no time limit, so the limit of this step stops a
        # program that never ends.
        if: runner.os == 'Windows'
        env:
          LUS_JIT: "off"
        shell: pwsh
        run: runtime\zig-out\bin\lus.exe tests/diff/run.lus --count 40 --start 1 --jobs 4 --lus runtime\zig-out\bin\lus.exe --out "$env:RUNNER_TEMP\diff-findings"
      - name: Allocation failure sweep
        timeout-minutes: 25
        if: runner.os == 'Linux'
        run: |
          (cd runtime && zig build -Doptimize=ReleaseSafe -Dfail-alloc=true --prefix zig-out-oom)
          LUS_JIT=off runtime/zig-out/bin/lus tests/oom/run.lus --samples 8 --jobs 4 --timeout 120
      - name: WebAssembly host tests
        timeout-minutes: 10
        if: runner.os == 'Linux'
        working-directory: packages/wasm
        run: node --test
      - name: Conformance tests on WebAssembly
        timeout-minutes: 20
        # Tests that need the network, workers, or processes fail under
        # WASI. The run fails when the JIT modes disagree or a test crashes.
        if: runner.os == 'Linux'
        working-directory: packages/wasm
        run: node scripts/conformance.mjs --modes off,eager

