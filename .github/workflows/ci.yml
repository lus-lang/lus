name: CI

# Runs the checks that a change reaches. tools/ci/areas.mjs reads the
# changed paths against tools/ci/areas.json and names the conformance
# files, the checks, and the runners of the change, and the jobs of
# full.yml it needs. The conformance files that the coverage of the last
# nightly run saw reach a changed source file run too (tools/ci/testmap.mjs).
# Lint and the generated files are checked on every change. nightly.yml
# runs everything once a day, and a release tag runs everything before it
# builds.

on:
  push:
    branches: [main, rewrite]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  ZIG_VERSION: "0.17.1"
  NODE_VERSION: "24.7.0"

jobs:
  plan:
    name: Plan the checks of the change
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      runtime: ${{ steps.plan.outputs.runtime }}
      full: ${{ steps.plan.outputs.full }}
      targets: ${{ steps.plan.outputs.targets }}
      ci: ${{ steps.plan.outputs.ci }}
      benches: ${{ steps.plan.outputs.benches }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: The map of the last nightly run
        # The plan works without the map, from the path map alone.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow nightly.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          if [ -n "$id" ]; then gh run download "$id" --repo "$GITHUB_REPOSITORY" --name testmap --dir "$RUNNER_TEMP/testmap"; fi
      - name: Plan
        id: plan
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          node tools/ci/areas.mjs plan --base "$BASE" --head HEAD --testmap "$RUNNER_TEMP/testmap/testmap.json" > "$RUNNER_TEMP/plan.json"
          { echo '```json'; cat "$RUNNER_TEMP/plan.json"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  lint:
    name: Lint and generated files
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Repository lint
        run: node tools/lint-repo.js
      - name: Generator tests
        run: node tools/build-lsp.test.js && node tools/build-grammar.test.js
      - name: Release tool tests
        run: node --test tools/release-version.test.mjs
      - name: Generated files are current
        run: node tools/build-lsp.js --check && node tools/build-grammar.js --check
      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Formatting
        working-directory: runtime
        run: zig fmt --check src build.zig

  tools:
    name: CI tools
    needs: plan
    if: ${{ needs.plan.outputs.ci == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Tests of the path map and the planner
        run: node --test tools/ci/*.test.mjs
      - name: Every file belongs to an area
        run: node tools/ci/areas.mjs unmatched
      - name: CODEOWNERS agrees with the path map
        run: node tools/ci/areas.mjs codeowners

  runtime:
    name: Runtime (${{ matrix.os }})
    needs: plan
    if: ${{ needs.plan.outputs.runtime != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.runtime) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: ${{ contains(matrix.checks, 'wasm') || contains(matrix.checks, 'install') }}
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Unit, embedding, and tool tests
        if: ${{ contains(matrix.checks, 'unit') }}
        timeout-minutes: 30
        working-directory: runtime
        run: zig build test test-embed test-bundle test-runtime test-check test-doc -Doptimize=ReleaseSafe
      - name: Debugger tests
        if: ${{ contains(matrix.checks, 'debug') && runner.os != 'Windows' }}
        timeout-minutes: 15
        working-directory: runtime
        run: zig build test-debug -Doptimize=ReleaseSafe
      - name: Version manager and remote module tests
        if: ${{ contains(matrix.checks, 'version') && runner.os != 'Windows' }}
        timeout-minutes: 15
        working-directory: runtime
        run: zig build test-version test-remote -Doptimize=ReleaseSafe
      - name: Build
        timeout-minutes: 15
        working-directory: runtime
        run: zig build -Doptimize=ReleaseSafe
      - name: Native code runs
        timeout-minutes: 5
        # A silent fall back to the interpreter would pass every other step.
        working-directory: runtime
        env:
          LUS_JIT: eager
        run: zig-out/bin/lus -e "local function f() end f() assert(debug.jit(f), 'no native code')"
      - name: Conformance tests
        if: ${{ matrix.tests != '' }}
        timeout-minutes: 20
        working-directory: runtime
        run: zig-out/bin/lus test ${{ matrix.tests }}
      - name: Conformance tests in native code
        if: ${{ matrix.tests != '' }}
        timeout-minutes: 20
        working-directory: runtime
        env:
          LUS_JIT: eager
        run: zig-out/bin/lus test ${{ matrix.tests }}
      - name: Conformance tests interpreted
        if: ${{ matrix.tests != '' }}
        timeout-minutes: 20
        working-directory: runtime
        env:
          LUS_JIT: "off"
        run: zig-out/bin/lus test ${{ matrix.tests }}
      - name: Conformance tests in optimized code
        if: ${{ matrix.tests != '' }}
        timeout-minutes: 20
        working-directory: runtime
        env:
          LUS_JIT: opt-eager
        run: zig-out/bin/lus test ${{ matrix.tests }}
      - name: Conformance tests with short chains of direct calls
        if: ${{ contains(matrix.checks, 'direct') && matrix.tests != '' }}
        timeout-minutes: 20
        working-directory: runtime
        env:
          LUS_JIT: opt-eager
          LUS_JIT_DIRECT: "1024"
        run: zig-out/bin/lus test ${{ matrix.tests }}
      - name: Conformance tests under the collector at every 97th allocation
        # HACKING.md asks for this run after a change to the heap, a store,
        # or the JIT, since the verifier finds a missing barrier.
        if: ${{ contains(matrix.checks, 'stress') && matrix.tests != '' }}
        timeout-minutes: 90
        working-directory: runtime
        env:
          LUS_JIT: eager
        run: |
          zig build -Doptimize=ReleaseSafe -Dgc-stress=97 -Dgc-verify=true --prefix zig-out-stress
          zig-out-stress/bin/lus test ${{ matrix.tests }}
      - name: Documentation examples
        if: ${{ contains(matrix.checks, 'doc') }}
        timeout-minutes: 10
        working-directory: runtime
        run: zig-out/bin/lus test --doc ../packages/site/src/manual ../spec ../.agents
      - name: WebAssembly
        if: ${{ contains(matrix.checks, 'wasm') && runner.os == 'Linux' }}
        timeout-minutes: 40
        run: |
          (cd runtime && zig build wasm)
          mkdir -p packages/wasm/dist
          cp runtime/zig-out/wasm/lus.wasm packages/wasm/dist/lus.wasm
          cd packages/wasm
          node --test
          node scripts/conformance.mjs --modes off,eager
      - name: Unix installer
        if: ${{ contains(matrix.checks, 'install') && runner.os != 'Windows' }}
        timeout-minutes: 10
        run: node --test packaging/install/install.test.mjs
      - name: Differential tests
        if: ${{ contains(matrix.checks, 'diff') && runner.os != 'Windows' }}
        timeout-minutes: 20
        env:
          LUS_JIT: "off"
        run: runtime/zig-out/bin/lus tests/diff/run.lus --count 200 --start 1 --jobs 4 --timeout 120 --out "$RUNNER_TEMP/diff-findings"
      - name: Allocation failure sweep
        if: ${{ (contains(matrix.checks, 'oom') || contains(matrix.checks, 'faults')) && runner.os == 'Linux' }}
        timeout-minutes: 25
        run: |
          (cd runtime && zig build -Doptimize=ReleaseSafe -Dfail-alloc=true --prefix zig-out-oom)
          if ${{ contains(matrix.checks, 'oom') }}; then
            LUS_JIT=off runtime/zig-out/bin/lus tests/oom/run.lus --samples 8 --jobs 4 --timeout 120
          fi
      - name: Corrupted input
        if: ${{ contains(matrix.checks, 'corrupt') && runner.os != 'Windows' }}
        timeout-minutes: 10
        run: LUS_JIT=off runtime/zig-out/bin/lus tests/corrupt/run.lus --lus runtime/zig-out/bin/lus
      - name: Mutated source
        if: ${{ contains(matrix.checks, 'syntax') && runner.os != 'Windows' }}
        timeout-minutes: 10
        run: LUS_JIT=off runtime/zig-out/bin/lus tests/syntax/run.lus --count 8 --seed ${{ github.run_number }}
      - name: Build with injected I/O failures
        if: ${{ (contains(matrix.checks, 'crash') || contains(matrix.checks, 'faults')) && runner.os != 'Windows' }}
        timeout-minutes: 15
        working-directory: runtime
        run: zig build -Doptimize=ReleaseSafe -Dfail-io=true --prefix zig-out-io
      - name: Crash tests
        if: ${{ contains(matrix.checks, 'crash') && runner.os != 'Windows' }}
        timeout-minutes: 20
        run: LUS_JIT=off runtime/zig-out-io/bin/lus tests/crash/run.lus --lus runtime/zig-out-io/bin/lus
      - name: Faults
        if: ${{ contains(matrix.checks, 'faults') && runner.os != 'Windows' }}
        timeout-minutes: 25
        run: |
          LUS_JIT=off runtime/zig-out-io/bin/lus tests/faults/workers.lus --lus runtime/zig-out-io/bin/lus
          if [ "$RUNNER_OS" = Linux ]; then LUS_JIT=off runtime/zig-out/bin/lus tests/faults/workers.lus --alloc --lus runtime/zig-out-oom/bin/lus; fi
          LUS_JIT=off runtime/zig-out-io/bin/lus tests/faults/network.lus --lus runtime/zig-out-io/bin/lus
          LUS_JIT=off runtime/zig-out-io/bin/lus tests/faults/cancel.lus --lus runtime/zig-out-io/bin/lus
          LUS_JIT=off runtime/zig-out-io/bin/lus tests/faults/clock.lus --lus runtime/zig-out-io/bin/lus

  pull-request:
    name: Commit messages and the fields of the pull request
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Commit messages
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: node tools/ci/commits.mjs range "$BASE" "$HEAD"
      - name: Kind and agent disclosure
        if: ${{ !cancelled() }}
        env:
          BODY: ${{ github.event.pull_request.body }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          printf '%s' "$BODY" > "$RUNNER_TEMP/body.md"
          node tools/ci/pr.mjs check --body-file "$RUNNER_TEMP/body.md" --base "$BASE" --head "$HEAD"

  perf:
    name: Benchmarks of the change
    # The benchmarks of the paths of the change run on the base and on the
    # head in turn, on one runner. The result goes to an artifact, and
    # perf-label.yml labels the pull request from it, since the token of a
    # pull request from a fork cannot.
    needs: plan
    if: ${{ github.event_name == 'pull_request' && needs.plan.outputs.benches != '[]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Build the base and the head
        timeout-minutes: 30
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          git worktree add "$RUNNER_TEMP/base" "$BASE"
          (cd "$RUNNER_TEMP/base/runtime" && zig build -Doptimize=ReleaseFast --prefix "$RUNNER_TEMP/lus-base")
          (cd runtime && zig build -Doptimize=ReleaseFast --prefix "$RUNNER_TEMP/lus-head")
      - name: Measure
        timeout-minutes: 25
        env:
          BENCHES: ${{ needs.plan.outputs.benches }}
          NUMBER: ${{ github.event.pull_request.number }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/perf"
          only=$(echo "$BENCHES" | jq -r 'join(",")')
          node tools/ci/perf.mjs ab --base "$RUNNER_TEMP/lus-base/bin/lus" --head "$RUNNER_TEMP/lus-head/bin/lus" --only "$only" --out "$RUNNER_TEMP/perf/ab.json" | tee -a "$GITHUB_STEP_SUMMARY"
          jq -n --arg number "$NUMBER" --arg sha "$HEAD" '{number: ($number | tonumber), sha: $sha}' > "$RUNNER_TEMP/perf/pr.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: perf
          path: ${{ runner.temp }}/perf
          retention-days: 7

  full:
    name: Full
    needs: plan
    if: ${{ needs.plan.outputs.full != '[]' }}
    uses: ./.github/workflows/full.yml
    with:
      jobs: ${{ needs.plan.outputs.full }}
      targets: ${{ needs.plan.outputs.targets }}
    secrets: inherit

  # The one check that branch rules require. The set of jobs differs from
  # change to change, so this job waits for all of them and passes when
  # each one passed or was left out by the plan.
  ci-ok:
    name: ci-ok
    if: ${{ always() }}
    needs: [plan, lint, tools, runtime, pull-request, perf, full]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every job passed or was left out
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          bad=$(echo "$RESULTS" | jq -r '[to_entries[] | select(.value.result != "success" and .value.result != "skipped") | .key] | join(", ")')
          if [ -n "$bad" ]; then echo "failed or cancelled: $bad" >&2; exit 1; fi
