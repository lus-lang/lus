name: Ship

# Releases the version that runtime/build.zig.zon holds, X.Y.Z-dev, from
# one start of this workflow:
#
#   1. prepare checks that CI passed on the commit, that the last nightly
#      run passed, that the tag is new, and that the secrets are set. It
#      writes the changes of the release commit (tools/release-version.mjs
#      release).
#   2. full runs every job of full.yml on the commit, as the nightly run
#      does. build runs release.yml on it, which tests it, builds every
#      target, lus.wasm, the VSIX, and the Windows installer, and attests
#      the provenance of each file.
#   3. github waits for the approval of the environment release, then
#      pushes the tag vX.Y.Z and publishes the release as the latest,
#      which install.sh and lus-setup.exe download. The tag points to the
#      release commit, whose parent is the commit of the run. No branch
#      holds the release commit.
#   4. index, vscode, and npm add the release to the signed index of
#      `lus version`, publish the VSIX to Open VSX, and publish lus-wasm to
#      npm.
#   5. next opens a pull request that brings the dated changelog and the
#      news page of the release to the branch and starts X.(Y+1).0-dev.
#      The site deploys from the branch, so merging it publishes the news
#      and rebuilds the playground with the lus.wasm of the release.
#
# The rulesets let only repository administrators and the Lus app create
# v* tags. They also require a reviewed pull request for every change to
# the branch. The Lus app is the GitHub App of the project, which the
# ruleset of the tags lists as a bypass actor. Each job mints a token of
# the app with only the permissions the job needs. The tag push uses a
# token that writes contents. The pull request is opened with a token
# that also writes pull requests, so CI runs on it. A published release
# is immutable, so the workflow creates each release as a draft, uploads
# all its assets, and publishes it last.
#
# A start from the Actions tab is a dry run unless `dry_run` is cleared. A
# dry run does every step up to the point of publishing and then prints
# what it would publish. A push to rewrite that changes the release
# workflows or tools runs a dry run as well.
#
# The secrets are LUS_APP_ID and LUS_APP_PRIVATE_KEY (the Lus app),
# LUS_RELEASE_SIGNING_SEED and LUS_RELEASE_SIGNING_KEY_ID
# (release-index.yml), OVSX_PAT (publish-vscode.yml), and NPM_TOKEN, an
# npm automation token that can publish lus-wasm.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and check everything, then publish nothing"
        type: boolean
        default: true
  push:
    branches: [rewrite]
    paths:
      - .github/workflows/ship.yml
      - .github/workflows/release.yml
      - .github/workflows/release-index.yml
      - .github/workflows/publish-vscode.yml
      - packaging/release/**
      - tools/release-version.mjs
      - tools/release-index.mjs

permissions:
  contents: write
  actions: read
  id-token: write
  attestations: write

concurrency:
  group: ship
  cancel-in-progress: false

env:
  NODE_VERSION: "24.7.0"
  DRY_RUN: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run }}

jobs:
  prepare:
    name: Check the gates and write the release commit
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      date: ${{ steps.version.outputs.date }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Read the version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          current="$(sed -n 's/^ *\.version = "\(.*\)",/\1/p' runtime/build.zig.zon)"
          if [[ ! "$current" =~ ^[0-9]+\.[0-9]+\.[0-9]+-dev$ ]]; then
            echo "build.zig.zon holds $current, and a release starts from X.Y.Z-dev" >&2
            exit 1
          fi
          version="${current%-dev}"
          {
            echo "version=$version"
            echo "tag=v$version"
            echo "date=$(date -u +%Y-%m-%d)"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing $version from $GITHUB_SHA on $GITHUB_REF_NAME (dry run: $DRY_RUN)" >> "$GITHUB_STEP_SUMMARY"
      - name: Check the gates
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          LUS_APP_ID: ${{ secrets.LUS_APP_ID }}
          LUS_APP_PRIVATE_KEY: ${{ secrets.LUS_APP_PRIVATE_KEY }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
          LUS_RELEASE_SIGNING_SEED: ${{ secrets.LUS_RELEASE_SIGNING_SEED }}
          LUS_RELEASE_SIGNING_KEY_ID: ${{ secrets.LUS_RELEASE_SIGNING_KEY_ID }}
        shell: bash
        run: |
          set -euo pipefail
          problems=()
          if [ "$GITHUB_REF_TYPE" != branch ]; then problems+=("the workflow runs on $GITHUB_REF_TYPE $GITHUB_REF_NAME, and a release starts from a branch"); fi
          # A lookup that fails is a problem of its own, so one run lists
          # every gap.
          lookup() { gh api "$1" --jq "$2" 2>/dev/null; }
          # The commit must be the head of its branch, so the release
          # commit and the next version follow it.
          if head="$(lookup "repos/$GITHUB_REPOSITORY/commits/$GITHUB_REF_NAME" .sha)"; then
            if [ "$head" != "$GITHUB_SHA" ]; then problems+=("$GITHUB_REF_NAME moved to $head after the run started"); fi
          else
            problems+=("the head of $GITHUB_REF_NAME could not be read")
          fi
          # A workflow is found by its path, since the API resolves a file
          # name only for workflows on the default branch.
          workflow_id() { lookup "repos/$GITHUB_REPOSITORY/actions/workflows?per_page=100" ".workflows[] | select(.path == \".github/workflows/$1\") | .id"; }
          ci="$(workflow_id ci.yml || true)"
          if [ -z "$ci" ]; then
            problems+=("ci.yml has never run in the repository")
          elif ! passed="$(lookup "repos/$GITHUB_REPOSITORY/actions/workflows/$ci/runs?head_sha=$GITHUB_SHA&status=success&per_page=1" .total_count)"; then
            problems+=("the runs of ci.yml could not be read")
          elif [ "$passed" = 0 ]; then
            problems+=("ci.yml has not passed on $GITHUB_SHA")
          fi
          # The schedule runs nightly.yml from the default branch, so its
          # runs carry the commit of that branch. The last one must pass.
          nightly="$(workflow_id nightly.yml || true)"
          if [ -z "$nightly" ]; then
            problems+=("nightly.yml has never run, since it runs only from the default branch")
          elif ! last="$(lookup "repos/$GITHUB_REPOSITORY/actions/workflows/$nightly/runs?status=completed&per_page=1" '.workflow_runs[0].conclusion // "none"')"; then
            problems+=("the runs of nightly.yml could not be read")
          elif [ "$last" = none ]; then
            problems+=("nightly.yml has no completed run")
          elif [ "$last" != success ]; then
            problems+=("the last run of nightly.yml ended with $last")
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then problems+=("the tag $TAG exists"); fi
          if gh release view "$TAG" >/dev/null 2>&1; then problems+=("the release $TAG exists"); fi
          for secret in LUS_APP_ID LUS_APP_PRIVATE_KEY NPM_TOKEN OVSX_PAT LUS_RELEASE_SIGNING_SEED LUS_RELEASE_SIGNING_KEY_ID; do
            if [ -z "${!secret}" ]; then problems+=("the secret $secret is not set"); fi
          done
          if [ ! -f packaging/release/keys.json ]; then problems+=("packaging/release/keys.json is missing"); fi
          if [ "${#problems[@]}" -eq 0 ]; then
            echo "Every gate passed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          for p in "${problems[@]}"; do
            if [ "$DRY_RUN" = true ]; then echo "::warning::$p"; else echo "::error::$p"; fi
            echo "- $p" >> "$GITHUB_STEP_SUMMARY"
          done
          if [ "$DRY_RUN" != true ]; then exit 1; fi
      - name: Write the release commit
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DATE: ${{ steps.version.outputs.date }}
        shell: bash
        run: |
          set -euo pipefail
          node --test tools/release-version.test.mjs
          node tools/release-version.mjs release --version "$VERSION" --date "$DATE"
          node tools/lint-repo.js
          git add -A
          git diff --cached --binary > "$RUNNER_TEMP/release.patch"
          git diff --cached --stat
          node tools/release-version.mjs notes --version "$VERSION" > /dev/null
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ship-patch
          path: ${{ runner.temp }}/release.patch
          if-no-files-found: error

  build:
    name: Build
    needs: prepare
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.prepare.outputs.tag }}
      # The tag does not exist until the release is approved.
      ref: ${{ github.sha }}
      patch: ship-patch
      publish: false
      attest: ${{ github.event_name == 'workflow_dispatch' && !inputs.dry_run }}
    secrets: inherit

  # Every job of full.yml runs before the tag, as it does each night.
  full:
    name: Full
    needs: prepare
    uses: ./.github/workflows/full.yml
    with:
      ref: ${{ github.sha }}
    secrets: inherit

  github:
    name: Publish the GitHub release
    needs: [prepare, build, full]
    # A real release waits here for a reviewer of the environment release.
    # Every later job publishes only after this one.
    environment: ${{ (github.event_name == 'workflow_dispatch' && !inputs.dry_run) && 'release' || '' }}
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      # The tag push uses the token of the Lus app. A stored workflow token
      # would take precedence over it, so the checkout stores none.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ship-patch
          path: ${{ runner.temp }}/patch
      - name: Check the assets and write SHA256SUMS
        working-directory: dist
        shell: bash
        run: |
          set -euo pipefail
          diff <(sh ../packaging/release/assets.sh "$TAG" | sort) <(ls -1 | sort)
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ship-sums
          path: dist/SHA256SUMS
          if-no-files-found: error
      - name: Commit the release and the next version
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git apply --index "$RUNNER_TEMP/patch/release.patch"
          git commit -q -m "Release $VERSION"
          git tag -a "$TAG" -m "Lus $VERSION"
          node tools/release-version.mjs notes --version "$VERSION" > "$RUNNER_TEMP/notes.md"
          next="$(node tools/release-version.mjs next --version "$VERSION")"
          git add -A
          git commit -q -m "Start $next"
          git log --stat -2
          git bundle create "$RUNNER_TEMP/ship.bundle" "$GITHUB_SHA..HEAD" "$TAG"
          echo "NEXT=$next" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ship-commits
          path: ${{ runner.temp }}/ship.bundle
          if-no-files-found: error
      - name: Get a token of the Lus app
        if: env.DRY_RUN != 'true'
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.LUS_APP_ID }}
          private-key: ${{ secrets.LUS_APP_PRIVATE_KEY }}
          permission-contents: write
      - name: Push the tag
        if: env.DRY_RUN != 'true'
        env:
          APP_TOKEN: ${{ steps.app.outputs.token }}
        shell: bash
        run: git push "https://x-access-token:$APP_TOKEN@github.com/$GITHUB_REPOSITORY.git" "refs/tags/$TAG"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$DRY_RUN" = true ]; then
            echo "A release would publish $TAG with these assets and notes:"
            ls -l dist
            cat "$RUNNER_TEMP/notes.md"
            exit 0
          fi
          # A published release is immutable, so every asset is uploaded
          # while it is a draft.
          gh release create "$TAG" dist/* --draft --verify-tag --title "Lus $VERSION" --notes-file "$RUNNER_TEMP/notes.md"
          gh release edit "$TAG" --draft=false --latest

  index:
    name: Release index
    needs: [prepare, github]
    uses: ./.github/workflows/release-index.yml
    with:
      tag: ${{ needs.prepare.outputs.tag }}
      dry_run: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run }}
    secrets: inherit

  vscode:
    name: Open VSX
    needs: [prepare, github]
    uses: ./.github/workflows/publish-vscode.yml
    with:
      tag: ${{ needs.prepare.outputs.tag }}
      dry_run: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run }}
    secrets: inherit

  npm:
    name: Publish lus-wasm to npm
    needs: [prepare, github]
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: "https://registry.npmjs.org"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ship-patch
          path: ${{ runner.temp }}/patch
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-build
          path: ${{ runner.temp }}/build
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ship-sums
          path: ${{ runner.temp }}/sums
      - name: Stage the package
        shell: bash
        run: |
          set -euo pipefail
          git apply "$RUNNER_TEMP/patch/release.patch"
          test "$(node -p 'require("./packages/wasm/package.json").version')" = "$VERSION"
          # The package carries the lus.wasm of the release, byte for byte.
          (cd "$RUNNER_TEMP/build" && grep ' lus.wasm$' "$RUNNER_TEMP/sums/SHA256SUMS" | sha256sum --check --strict)
          mkdir -p packages/wasm/dist packages/wasm/licenses
          cp "$RUNNER_TEMP/build/lus.wasm" packages/wasm/dist/lus.wasm
          cp LICENSE.md packages/wasm/LICENSE.md
          cp packaging/notices/THIRD_PARTY_NOTICES.WASM.md packages/wasm/THIRD_PARTY_NOTICES.md
          for license in BROTLI LUA LUALS SQLITE TZDATA UNICODE WASI-LIBC ZIG ZSTD; do
            cp "packaging/licenses/LICENSE.$license.txt" packages/wasm/licenses/
          done
      - name: Test the package
        working-directory: packages/wasm
        run: node --test
      - name: Publish
        working-directory: packages/wasm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$DRY_RUN" = true ]; then
            npm publish --dry-run --access public
          else
            npm publish --provenance --access public
          fi

  next:
    name: Open the pull request of the next version
    needs: [prepare, github, index, vscode, npm]
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ship-commits
          path: ${{ runner.temp }}/commits
      - name: Write the commit of the next version
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch -q "$RUNNER_TEMP/commits/ship.bundle" HEAD
          # The pull request holds one commit on top of the commit of the
          # run, with the dated changelog, the news page, and X.(Y+1).0-dev.
          git checkout -q -b "release/$TAG" FETCH_HEAD
          git reset -q --soft "$GITHUB_SHA"
          next="$(sed -n 's/^ *\.version = "\(.*\)",/\1/p' runtime/build.zig.zon)"
          git commit -q -m "Start $next after the release of $VERSION"
          git show --stat HEAD
          echo "NEXT=$next" >> "$GITHUB_ENV"
      - name: Get a token of the Lus app
        if: env.DRY_RUN != 'true'
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.LUS_APP_ID }}
          private-key: ${{ secrets.LUS_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Open the pull request
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          git push "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" "HEAD:refs/heads/release/$TAG"
          gh pr create --base "$GITHUB_REF_NAME" --head "release/$TAG" \
            --title "Start $NEXT after the release of $VERSION" \
            --body "Lus $VERSION is released as $TAG. This dates its section of CHANGELOG.md, adds its news page to the site, and starts $NEXT. The site deploys the news when this merges."
