name: Nightly

# The long versions of the tests in spec/design/testing.md. Each job runs
# on the rewrite branch once a day and can be started by hand.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  ZIG_VERSION: "0.17.1"
  NODE_VERSION: "24.7.0"

jobs:
  stress:
    name: Collect at every allocation (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: rewrite
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Build
        working-directory: runtime
        run: zig build -Doptimize=ReleaseSafe -Dgc-stress=1 -Dgc-verify=true
      - name: Conformance tests interpreted
        timeout-minutes: 110
        working-directory: runtime
        env:
          LUS_JIT: "off"
        run: zig-out/bin/lus test ../tests/conformance
      - name: Conformance tests in native code
        timeout-minutes: 110
        working-directory: runtime
        env:
          LUS_JIT: eager
        run: zig-out/bin/lus test ../tests/conformance
      - name: Conformance tests in optimized code
        timeout-minutes: 110
        working-directory: runtime
        env:
          LUS_JIT: opt-eager
        run: zig-out/bin/lus test ../tests/conformance

  emulated:
    name: Emulated architectures (${{ matrix.target }})
    # Static builds for instruction sets that GitHub has no runners for,
    # run under qemu-user (spec/design/platforms.md, "Testing each
    # target"). LUS_EMULATED skips the test whose bound qemu-user breaks.
    strategy:
      fail-fast: false
      matrix:
        target: [riscv64-linux-musl, loongarch64-linux-musl, powerpc64le-linux-musl, arm-linux-musleabihf, s390x-linux-musl]
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: rewrite
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Install qemu-user
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static binfmt-support
      - name: Build
        working-directory: runtime
        run: |
          zig build -Doptimize=ReleaseSafe -Dtarget=${{ matrix.target }}
          zig build -Doptimize=ReleaseSafe -Dgc-stress=97 -Dgc-verify=true -Dtarget=${{ matrix.target }} --prefix zig-out-stress
      - name: Conformance tests in every JIT mode
        timeout-minutes: 200
        working-directory: runtime
        env:
          LUS_EMULATED: "1"
        run: |
          for mode in off on eager baseline opt-eager; do
            echo "== LUS_JIT=$mode"
            LUS_JIT=$mode zig-out/bin/lus test --timeout 300 ../tests/conformance ../packages/language-server/tests
          done
          echo "== LUS_JIT=opt-eager LUS_JIT_DIRECT=1024"
          LUS_JIT=opt-eager LUS_JIT_DIRECT=1024 zig-out/bin/lus test --timeout 300 ../tests/conformance
      - name: Conformance tests in a collector stress build
        timeout-minutes: 120
        working-directory: runtime
        env:
          LUS_EMULATED: "1"
        run: |
          for mode in eager opt-eager; do
            echo "== LUS_JIT=$mode"
            LUS_JIT=$mode zig-out-stress/bin/lus test --timeout 600 ../tests/conformance
          done

  freebsd:
    name: FreeBSD (x86-64)
    # A FreeBSD virtual machine on a Linux runner runs a build that the
    # runner cross-compiles (spec/design/platforms.md, "FreeBSD and
    # Android").
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: rewrite
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Build
        working-directory: runtime
        run: zig build -Doptimize=ReleaseSafe -Dtarget=x86_64-freebsd
      - name: Conformance tests in a FreeBSD virtual machine
        uses: cross-platform-actions/action@30cde56b87a128507bebea9531205087890ee360 # v1.8.0
        with:
          operating_system: freebsd
          architecture: x86-64
          version: "14.2"
          run: |
            cd runtime
            zig-out/bin/lus -e "local function f() end f() assert(debug.jit(f), 'no native code')"
            for mode in on eager opt-eager; do
              echo "== LUS_JIT=$mode"
              LUS_JIT=$mode zig-out/bin/lus test ../tests/conformance ../packages/language-server/tests
            done

  differential:
    name: Differential tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: rewrite
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Build
        working-directory: runtime
        run: |
          zig build -Doptimize=ReleaseSafe
          zig build -Doptimize=ReleaseSafe -Dgc-stress=97 -Dgc-verify=true --prefix zig-out-stress
          zig build wasm
      - name: Generate and compare programs for 80 minutes
        timeout-minutes: 95
        env:
          LUS_JIT: "off"
        run: runtime/zig-out/bin/lus tests/diff/run.lus --forever --minutes 80 --reduce --jobs 4 --timeout 120 --stress runtime/zig-out-stress/bin/lus --wasm runtime/zig-out/wasm/lus.wasm --out findings
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: diff-findings-${{ matrix.os }}
          path: findings

  oom:
    name: Allocation and I/O failure sweeps
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: rewrite
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Build
        working-directory: runtime
        run: |
          zig build -Doptimize=ReleaseSafe
          zig build -Doptimize=ReleaseSafe -Dfail-alloc=true --prefix zig-out-oom
      - name: Fail one allocation
        timeout-minutes: 120
        env:
          LUS_JIT: "off"
        run: runtime/zig-out/bin/lus tests/oom/run.lus --samples 400 --jobs 4 --timeout 120
      - name: Fail every allocation from one point on
        timeout-minutes: 60
        env:
          LUS_JIT: "off"
        run: runtime/zig-out/bin/lus tests/oom/run.lus --samples 100 --sticky --jobs 4 --timeout 120
      - name: Build with I/O fault injection
        working-directory: runtime
        run: zig build -Doptimize=ReleaseSafe -Dfail-io=true --prefix zig-out-io
      - name: Fail one file or socket operation
        timeout-minutes: 60
        env:
          LUS_JIT: "off"
        run: runtime/zig-out/bin/lus tests/oom/run.lus --io --samples 200 --jobs 4 --timeout 120
      - name: Shorten every read and write from one point on
        timeout-minutes: 30
        env:
          LUS_JIT: "off"
        run: runtime/zig-out/bin/lus tests/oom/run.lus --io --short --samples 50 --jobs 4 --timeout 120

  limits:
    name: Every limit at the limit and one past it
    runs-on: ubuntu-24.04
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: rewrite
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Build
        working-directory: runtime
        run: |
          zig build -Doptimize=ReleaseSafe
          zig build -Doptimize=ReleaseSafe -Dfail-alloc=true --prefix zig-out-oom
      - name: Find each limit in every JIT mode
        timeout-minutes: 120
        env:
          LUS_JIT: "off"
        run: |
          mkdir -p edge
          runtime/zig-out/bin/lus tests/limits/run.lus --emit edge
      - name: Fail allocations in the programs at their limits
        timeout-minutes: 60
        env:
          LUS_JIT: "off"
        run: runtime/zig-out/bin/lus tests/oom/run.lus --lus runtime/zig-out-oom/bin/lus --samples 30 --jobs 4 --timeout 120 edge

  coverage:
    name: Branch coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: rewrite
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Build with coverage
        working-directory: runtime
        run: zig build -Doptimize=ReleaseFast -Dcoverage=true -Dfail-alloc=true -Dfail-io=true --prefix zig-out-cov
      - name: Run the conformance suite and the doc tests
        timeout-minutes: 90
        working-directory: runtime
        run: |
          mkdir -p runs
          for mode in off on opt-eager; do
            LUS_JIT=$mode LUS_BIN=$PWD/zig-out-cov/bin/lus LUS_COVERAGE=$PWD/runs zig-out-cov/bin/lus test ../tests/conformance ../packages/language-server/tests || true
          done
          LUS_BIN=$PWD/zig-out-cov/bin/lus LUS_COVERAGE=$PWD/runs zig-out-cov/bin/lus test --doc ../packages/site/src/manual ../spec ../.agents || true
      - name: Report of the suite
        working-directory: runtime
        run: |
          LUS_COVERAGE_REPORT=$PWD/runs zig-out-cov/bin/lus | tee coverage.txt
          LUS_JIT=off zig-out-cov/bin/lus ../tests/coverage/ratchet.lus coverage.txt ../tests/coverage/baseline.txt | tee ratchet.txt || true
          { echo '### The suite'; echo '```'; cat coverage.txt; echo; cat ratchet.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Allocation and I/O failure sweeps
        timeout-minutes: 120
        working-directory: runtime
        # The failure paths of `try`, `catch`, and `orelse` run only when an
        # allocation or an operation fails.
        env:
          LUS_JIT: "off"
        run: |
          zig-out-cov/bin/lus ../tests/oom/run.lus --coverage $PWD/runs --lus zig-out-cov/bin/lus --samples 100 --jobs 4 --timeout 120 ../tests/conformance || true
          zig-out-cov/bin/lus ../tests/oom/run.lus --coverage $PWD/runs --io --lus zig-out-cov/bin/lus --samples 40 --jobs 4 --timeout 120 ../tests/conformance || true
      - name: Report with the sweeps
        working-directory: runtime
        run: |
          LUS_COVERAGE_REPORT=$PWD/runs zig-out-cov/bin/lus | tee coverage-sweeps.txt
          { echo '### The suite and the failure sweeps'; echo '```'; cat coverage-sweeps.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Unit tests with coverage
        timeout-minutes: 40
        working-directory: runtime
        run: |
          zig build unit-binary -Dcoverage=true -Dfail-alloc=true -Dfail-io=true --prefix zig-out-cov
          mkdir -p unit-runs
          LUS_COVERAGE=$PWD/unit-runs zig-out-cov/bin/lus-unit || true
          LUS_COVERAGE_REPORT=$PWD/unit-runs LUS_COVERAGE_EXPORT=$PWD/unit.keys zig-out-cov/bin/lus-unit > /dev/null
      - name: The verifying build with coverage
        timeout-minutes: 80
        working-directory: runtime
        # Collecting at every 97th allocation reaches states of the collector
        # that the suite reaches only by chance.
        run: |
          zig build -Doptimize=ReleaseFast -Dcoverage=true -Dgc-stress=97 -Dgc-verify=true --prefix zig-out-cov-verify
          mkdir -p verify-runs
          LUS_JIT=off LUS_BIN=$PWD/zig-out-cov-verify/bin/lus LUS_COVERAGE=$PWD/verify-runs zig-out-cov-verify/bin/lus test ../tests/conformance ../packages/language-server/tests || true
          LUS_COVERAGE_REPORT=$PWD/verify-runs LUS_COVERAGE_EXPORT=$PWD/verify.keys zig-out-cov-verify/bin/lus > /dev/null
      - name: Report with every build
        working-directory: runtime
        run: |
          LUS_COVERAGE_REPORT=$PWD/runs LUS_COVERAGE_MERGE=$PWD/unit.keys,$PWD/verify.keys zig-out-cov/bin/lus | tee coverage-merged.txt
          { echo '### The suite, the sweeps, the unit tests, and the verifying build'; echo '```'; cat coverage-merged.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage
          path: |
            runtime/coverage.txt
            runtime/coverage-sweeps.txt
            runtime/coverage-merged.txt

  invariants:
    name: Invariant checks
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: rewrite
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Build with the invariant checks
        working-directory: runtime
        run: zig build -Doptimize=ReleaseSafe -Dinvariants=true --prefix zig-out-inv
      - name: Run the conformance suite interpreted and in optimized code
        timeout-minutes: 90
        working-directory: runtime
        # The checks walk tables after each resize, the shape tree on each
        # new shape, and the heap at the end of each mark phase.
        run: |
          for mode in off opt-eager; do
            LUS_JIT=$mode LUS_BIN=$PWD/zig-out-inv/bin/lus zig-out-inv/bin/lus test ../tests/conformance ../packages/language-server/tests
          done

  mutate:
    name: Mutation testing
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: rewrite
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Build, and measure which lines the suite covers
        timeout-minutes: 60
        working-directory: runtime
        run: |
          zig build -Doptimize=ReleaseSafe
          zig build -Doptimize=ReleaseFast -Dcoverage=true --prefix zig-out-cov
          mkdir -p runs
          LUS_JIT=off LUS_BIN=$PWD/zig-out-cov/bin/lus LUS_COVERAGE=$PWD/runs zig-out-cov/bin/lus test ../tests/conformance ../packages/language-server/tests || true
          LUS_COVERAGE_REPORT=$PWD/runs LUS_COVERAGE_EXPORT=$PWD/covered.keys zig-out-cov/bin/lus > /dev/null
      - name: Sample 40 mutants
        timeout-minutes: 285
        # A new seed each night samples other mutants. The harness starts no
        # new mutant after 270 minutes, inside the limit of the step.
        run: |
          LUS_JIT=off runtime/zig-out/bin/lus tests/mutate/run.lus --count 40 --seed $(date +%j) --minutes 270 --covered $PWD/runtime/covered.keys | tee mutate.txt
          { echo '### Mutation testing'; echo '```'; tail -60 mutate.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mutate
          path: mutate.txt

  mcdc:
    name: MC/DC
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: rewrite
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Transform a copy of the runtime and build it
        working-directory: runtime
        run: |
          mkdir -p zig-out-mcdc/runs
          rsync -a --exclude .zig-cache --exclude 'zig-out*' ./ zig-out-mcdc/runtime/
          for d in spec .agents tests packages; do ln -s ../../$d zig-out-mcdc/$d; done
          zig run ../tests/coverage/mcdc/transform.zig -- zig-out-mcdc/runtime/src zig-out-mcdc/table.txt ../tests/coverage/mcdc/mcdc_rt.zig
          cd zig-out-mcdc/runtime && zig build -Doptimize=ReleaseFast
      - name: Run the conformance suite
        timeout-minutes: 90
        working-directory: runtime
        run: |
          B=$PWD/zig-out-mcdc/runtime/zig-out/bin/lus
          for mode in off on opt-eager; do
            LUS_JIT=$mode LUS_BIN=$B LUS_MCDC=$PWD/zig-out-mcdc/runs $B test ../tests/conformance ../packages/language-server/tests || true
          done
      - name: Report
        working-directory: runtime
        run: |
          LUS_JIT=off zig-out-mcdc/runtime/zig-out/bin/lus ../tests/coverage/mcdc/mcdc.lus zig-out-mcdc/table.txt zig-out-mcdc/runs | tee mcdc.txt
          { echo '### MC/DC'; echo '```'; cat mcdc.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mcdc
          path: runtime/mcdc.txt

  sanitize:
    name: Vendored C under the undefined behavior sanitizer
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: rewrite
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Build
        working-directory: runtime
        run: zig build -Doptimize=ReleaseSafe -Dsanitize-c=true
      - name: Conformance tests
        timeout-minutes: 30
        working-directory: runtime
        run: zig-out/bin/lus test ../tests/conformance
      - name: Fuzz the archive codecs and the other targets
        timeout-minutes: 75
        working-directory: runtime
        run: zig build test --fuzz=5M -Doptimize=ReleaseSafe -Dsanitize-c=true

  fuzz:
    name: Fuzzing
    runs-on: ubuntu-24.04
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: rewrite
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Fuzz every target
        timeout-minutes: 180
        working-directory: runtime
        run: zig build test --fuzz=20M -Doptimize=ReleaseSafe
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: fuzz-crash
          path: runtime/.zig-cache/f/crash
