name: Sign check

# Checks the code signing of a release from the branch rewrite, where
# ship.yml cannot run a real release. It builds lus for x86_64-windows,
# and for both macOS targets when the Apple secrets exist, signs them with the actions that release.yml
# signs with (.github/actions/sign-windows and sign-macos), and verifies
# each signature. It publishes nothing, and its artifacts, which only
# carry the build between its jobs, expire after a day.
#
# A push to rewrite that changes packaging/release/sign-check.txt starts
# it. build-windows cross compiles lus.exe on Linux, as release.yml does.
# The signing jobs need the secrets and variables of the environment
# release, which only a job in that environment can read, so each macOS
# job reads the secrets first and builds its target only when every
# APPLE_* secret is set. Without them it records a notice and builds
# nothing. Every signing job waits for build-windows, so they all wait
# for the approval of the environment at the same moment. One approval
# starts the check.

on:
  push:
    branches: [rewrite]
    paths:
      - packaging/release/sign-check.txt

permissions:
  contents: read
  id-token: write

concurrency:
  group: sign-check
  cancel-in-progress: false

env:
  ZIG_VERSION: "0.17.1"

jobs:
  build-windows:
    name: Build lus.exe
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      # The cache key names the workflow and the target, so no other job
      # that setup-zig keys by the same job name restores into it.
      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: ${{ env.ZIG_VERSION }}
          cache-key: sign-check-x86_64-windows
      - name: Build
        working-directory: runtime
        shell: bash
        run: |
          set -euo pipefail
          start=$SECONDS
          zig build -Doptimize=ReleaseFast -Dtarget=x86_64-windows --prefix ../out/x86_64-windows
          echo "zig build: $((SECONDS - start)) s"
          tar -C .. -cf "$RUNNER_TEMP/trees.tar" out
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sign-check-windows
          path: ${{ runner.temp }}/trees.tar
          if-no-files-found: error
          retention-days: 1

  windows:
    name: Sign and verify lus.exe
    needs: build-windows
    runs-on: windows-2022
    environment: release
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sign-check-windows
          path: ${{ runner.temp }}/trees
      - name: Unpack the tree
        shell: bash
        # GNU tar reads a path that starts with a drive letter, such as
        # D:\a\_temp, as host:path unless --force-local is given.
        run: tar --force-local -xf "$RUNNER_TEMP/trees/trees.tar" out/x86_64-windows
      - name: Sign lus.exe
        uses: ./.github/actions/sign-windows
        with:
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          account: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          profile: ${{ vars.AZURE_SIGNING_PROFILE }}
          files: out/x86_64-windows/bin/lus.exe
      - name: Verify the signature with signtool
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw "the runner has no signtool.exe" }
          & $signtool.FullName verify /pa /all /tw /v out\x86_64-windows\bin\lus.exe
          if ($LASTEXITCODE -ne 0) { throw "signtool verify failed with $LASTEXITCODE" }
          $signature = Get-AuthenticodeSignature out\x86_64-windows\bin\lus.exe
          "lus.exe is signed by $($signature.SignerCertificate.Subject), with a timestamp from $($signature.TimeStamperCertificate.Subject)." | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
      - name: Run the signed lus.exe
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $reported = & out\x86_64-windows\bin\lus.exe -v 2>&1
          if ($LASTEXITCODE -ne 0) { throw "lus.exe -v exited with $LASTEXITCODE" }
          Write-Output "$reported"

  macos:
    name: Sign and notarize lus for ${{ matrix.target }}
    needs: build-windows
    runs-on: ubuntu-24.04
    environment: release
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-macos, aarch64-macos]
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check the signing settings
        id: settings
        env:
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for name in APPLE_CERT_P12 APPLE_CERT_PASSWORD APPLE_API_KEY_P8 APPLE_API_KEY_ID APPLE_API_ISSUER; do
            if [ -z "${!name}" ]; then missing+=("$name"); fi
          done
          if [ "${#missing[@]}" -eq 0 ]; then
            echo "sign=true" >> "$GITHUB_OUTPUT"
          else
            echo "sign=false" >> "$GITHUB_OUTPUT"
            echo "::notice::The macOS check of $TARGET is skipped, since the environment release does not set ${missing[*]}"
            echo "The macOS check of $TARGET is skipped, since the environment release does not set ${missing[*]}." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Install Zig
        if: steps.settings.outputs.sign == 'true'
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: ${{ env.ZIG_VERSION }}
          cache-key: sign-check-${{ matrix.target }}
      - name: Build
        if: steps.settings.outputs.sign == 'true'
        working-directory: runtime
        shell: bash
        run: |
          set -euo pipefail
          start=$SECONDS
          zig build -Doptimize=ReleaseFast -Dtarget="$TARGET" --prefix "../out/$TARGET"
          zig build lib -Doptimize=ReleaseFast -Dtarget="$TARGET" --prefix "../out/$TARGET"
          echo "zig build: $((SECONDS - start)) s"
          {
            echo "libraries<<EOF"
            for lib in "../out/$TARGET"/lib/*.dylib; do
              if [ ! -L "$lib" ]; then echo "${lib#../}"; fi
            done
            echo "EOF"
          } >> "$GITHUB_ENV"
      - name: Sign and notarize
        if: steps.settings.outputs.sign == 'true'
        uses: ./.github/actions/sign-macos
        with:
          cert-p12: ${{ secrets.APPLE_CERT_P12 }}
          cert-password: ${{ secrets.APPLE_CERT_PASSWORD }}
          api-key-p8: ${{ secrets.APPLE_API_KEY_P8 }}
          api-key-id: ${{ secrets.APPLE_API_KEY_ID }}
          api-issuer: ${{ secrets.APPLE_API_ISSUER }}
          executables: out/${{ matrix.target }}/bin/lus
          libraries: ${{ env.libraries }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.settings.outputs.sign == 'true' && matrix.target == 'aarch64-macos'
        with:
          name: sign-check-macos
          path: out/aarch64-macos/bin/lus
          if-no-files-found: error
          retention-days: 1

  macos-verify:
    name: Verify the macOS signature on a Mac
    needs: macos
    if: ${{ needs.macos.result == 'success' }}
    runs-on: macos-15
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        id: download
        continue-on-error: true
        with:
          name: sign-check-macos
          path: signed
      - name: Verify with codesign and spctl
        if: steps.download.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          chmod +x signed/lus
          codesign --verify --strict --verbose=2 signed/lus
          codesign --display --entitlements - --verbose=2 signed/lus
          spctl --assess --type execute --verbose=2 signed/lus
          signed/lus -v
      - name: Record a skipped check
        if: steps.download.outcome != 'success'
        shell: bash
        run: echo "The macOS signature was not verified, since the macOS job signed nothing." >> "$GITHUB_STEP_SUMMARY"
