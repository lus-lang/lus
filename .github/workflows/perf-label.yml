name: Perf label

# Labels a pull request perf-regression when the benchmarks of its change
# in ci.yml regressed past the thresholds of tools/ci/perf.json, and
# comments the table. A run of ci.yml for a pull request from a fork
# cannot write to the pull request, so this workflow reads its artifact
# after it completes. It runs from the default branch and checks out no
# code of the pull request. tools/ci/gate.mjs reads the artifact as data,
# and the Lus app writes the label and the comment.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

jobs:
  label:
    name: Label from the benchmarks
    if: ${{ github.event.workflow_run.event == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - name: Get a token of the Lus app
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.LUS_APP_ID }}
          private-key: ${{ secrets.LUS_APP_PRIVATE_KEY }}
          permission-issues: write
          permission-pull-requests: write
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.7.0"
      - name: Download the measurement
        id: download
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.event.workflow_run.id }}
        run: |
          if gh run download "$RUN" --repo "$GITHUB_REPOSITORY" --name perf --dir "$RUNNER_TEMP/perf"; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "The run measured no benchmark."
          fi
      - name: Label
        if: ${{ steps.download.outputs.found == 'true' }}
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          number=$(jq -r '.number | tostring | select(test("^[0-9]+$"))' "$RUNNER_TEMP/perf/pr.json")
          [ -n "$number" ] || { echo "the artifact names no pull request" >&2; exit 1; }
          node tools/ci/gate.mjs perf "$number" "$SHA" "$RUNNER_TEMP/perf/ab.json"
