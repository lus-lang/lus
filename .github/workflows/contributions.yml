name: Contributions

# The gate, the labels, and the agents of pull requests and issues
# (spec/design/ci.md, "Contributions"). Both events run this file from the
# default branch, with the token of the base repository, so no job checks
# out or runs the code of a pull request. The review job reads its files
# as data.
#
# Every write goes through the Lus app (the secrets LUS_APP_ID and
# LUS_APP_PRIVATE_KEY). Each job that writes mints its own token with only
# the permissions of that job, and the jobs that give untrusted text to an
# agent hold no write token at all. A branch that the app pushes runs the
# workflows of its pull request, which a push with the workflow token
# would not.
#
# 1. The gate (tools/ci/gate.mjs) checks the author, the commits, the
#    fields of the description, and the paths, and refuses, closes, or
#    locks what fails. Nothing below runs for a contribution that fails it.
# 2. A pull request gets the labels of its areas and its Kind.
# 3. A pull request that passes gets one review against the rules of the
#    repository. The targeted tests of ci.yml run on its own event.
# 4. An issue that passes is sorted. A suggestion, a design proposal, or a
#    question moves to Discussions, and the issue is closed and locked. A bug report runs
#    its program without secrets, an agent looks for the cause and writes
#    a fix and a regression test without running anything, CI checks that
#    the test fails before the fix and passes after it, and the fix lands
#    on the branch agent/issue-N, with a pull request for the maintainer
#    to review.
#
# The models, the budgets in dollars, and the time limits of the agents
# are in tools/ci/agents.json. A manual run checks one number as a dry run,
# which prints each write and makes none.

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited, ready_for_review]
  issues:
    types: [opened, reopened, edited]
  workflow_dispatch:
    inputs:
      number:
        description: Pull request or issue to check as a dry run
        required: true

permissions:
  contents: read

concurrency:
  group: contributions-${{ github.event.pull_request.number || github.event.issue.number || inputs.number }}
  cancel-in-progress: false

env:
  NODE_VERSION: "24.7.0"
  ZIG_VERSION: "0.17.1"

jobs:
  gate:
    name: Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      kind: ${{ steps.gate.outputs.kind }}
      number: ${{ steps.gate.outputs.number }}
      passed: ${{ steps.gate.outputs.passed }}
      exempt: ${{ steps.gate.outputs.exempt }}
      newly_passed: ${{ steps.gate.outputs.newly_passed }}
      draft: ${{ steps.gate.outputs.draft }}
      agents: ${{ steps.config.outputs.agents }}
    steps:
      # The default branch, which holds the scripts and the rules.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Get a token of the Lus app
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.LUS_APP_ID }}
          private-key: ${{ secrets.LUS_APP_PRIVATE_KEY }}
          permission-issues: write
          permission-pull-requests: write
      - name: Gate
        id: gate
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          NUMBER: ${{ inputs.number }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: node tools/ci/gate.mjs gate
      - name: Labels of the areas and the Kind
        if: ${{ steps.gate.outputs.kind == 'pr' && steps.gate.outputs.action != 'lock' && steps.gate.outputs.action != 'reject' }}
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}
          NUMBER: ${{ inputs.number }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: node tools/ci/gate.mjs labels
      - name: Limits of the agents
        id: config
        run: echo "agents=$(jq -c . tools/ci/agents.json)" >> "$GITHUB_OUTPUT"

  review:
    name: Review against the rules
    needs: gate
    # Once per pull request and once more when it starts passing the gate,
    # since every run costs money. Drafts wait until they are ready.
    if: >-
      ${{ github.event_name == 'pull_request_target' && needs.gate.outputs.passed == 'true' && needs.gate.outputs.draft != 'true' &&
      (contains(fromJSON('["opened", "reopened", "ready_for_review"]'), github.event.action) || needs.gate.outputs.newly_passed == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ fromJSON(needs.gate.outputs.agents).review.timeout_minutes }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      # The default branch at the root of the workspace, where the agent
      # starts, so its settings and rules are the trusted ones.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      # The files of the pull request, as data, in a directory of their own.
      # Nothing in this directory runs: no install, no build, and no hook.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr-head
          persist-credentials: false
      - name: Get a token of the Lus app that only reads
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.LUS_APP_ID }}
          private-key: ${{ secrets.LUS_APP_PRIVATE_KEY }}
          permission-contents: read
          permission-pull-requests: read
          permission-issues: read
      - name: Gather the change and the prompt
        id: prompt
        env:
          GH_TOKEN: ${{ github.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          NUMBER: ${{ github.event.pull_request.number }}
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          dir="$RUNNER_TEMP/review"
          mkdir -p "$dir"
          printf '# %s\n\n%s\n' "$TITLE" "$BODY" > "$dir/description.md"
          gh api -H "Accept: application/vnd.github.diff" "repos/$GITHUB_REPOSITORY/pulls/$NUMBER" > "$dir/change.diff"
          echo "bot_id=$(gh api "users/$APP_SLUG[bot]" --jq .id)" >> "$GITHUB_OUTPUT"
          {
            echo "text<<LUS_PROMPT_END"
            sed -e "s|PR_DIR|$GITHUB_WORKSPACE/pr-head|g" -e "s|REVIEW_DIR|$dir|g" tools/ci/prompts/review.md
            echo "LUS_PROMPT_END"
          } >> "$GITHUB_OUTPUT"
      # The author of an outside pull request has no write access. The gate
      # has already checked the contribution, so the action admits every
      # author. The agent holds a token that only reads, can only read
      # files, and answers in the schema. The next job posts its answer.
      - name: Review
        id: review
        # v1.0.281, chosen on 2026-11-25.
        uses: anthropics/claude-code-action@e5812cd75691ca7bbfc57c0ecf4441db3a1ab7dd # v1.0.281
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ steps.app.outputs.token }}
          bot_name: ${{ steps.app.outputs.app-slug }}[bot]
          bot_id: ${{ steps.prompt.outputs.bot_id }}
          prompt: ${{ steps.prompt.outputs.text }}
          allowed_non_write_users: "*"
          allow_fork_prs: "true"
          restrict_untrusted_prs: "true"
          show_full_output: "false"
          display_report: "false"
          claude_args: >-
            --model ${{ fromJSON(needs.gate.outputs.agents).review.model }}
            --max-turns ${{ fromJSON(needs.gate.outputs.agents).review.max_turns }}
            --max-budget-usd ${{ fromJSON(needs.gate.outputs.agents).review.budget_usd }}
            --tools ${{ join(fromJSON(needs.gate.outputs.agents).review.tools, ',') }}
            --allowedTools ${{ join(fromJSON(needs.gate.outputs.agents).review.tools, ',') }}
            --disallowedTools ${{ join(fromJSON(needs.gate.outputs.agents).review.denied_tools, ',') }}
            --add-dir ${{ github.workspace }}/pr-head ${{ runner.temp }}/review
            --setting-sources user --strict-mcp-config
            --json-schema '{"type":"object","properties":{"review":{"type":"string"}},"required":["review"]}'
      - name: Write the review
        env:
          ANSWER: ${{ steps.review.outputs.structured_output }}
        run: printf '%s' "$ANSWER" | jq -r '.review // "The review agent gave no answer."' > "$RUNNER_TEMP/review.md"
      - name: The review holds no secret
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          APP_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          for secret in "$ANTHROPIC_API_KEY" "$APP_TOKEN"; do
            if [ -n "$secret" ] && grep -qF "$secret" "$RUNNER_TEMP/review.md"; then echo "the review holds a secret" >&2; exit 1; fi
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: review
          path: ${{ runner.temp }}/review.md
          retention-days: 7

  post-review:
    name: Post the review
    needs: [gate, review]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: review
          path: ${{ runner.temp }}/review
      - name: Get a token of the Lus app
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.LUS_APP_ID }}
          private-key: ${{ secrets.LUS_APP_PRIVATE_KEY }}
          permission-issues: write
          permission-pull-requests: write
      - name: Comment
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}
        run: node tools/ci/gate.mjs comment "${{ needs.gate.outputs.number }}" "$RUNNER_TEMP/review/review.md" "<!-- lus-review -->"

  triage:
    name: Sort the issue
    needs: gate
    if: >-
      ${{ github.event_name == 'issues' && needs.gate.outputs.passed == 'true' &&
      (contains(fromJSON('["opened", "reopened"]'), github.event.action) || needs.gate.outputs.newly_passed == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ fromJSON(needs.gate.outputs.agents).triage.timeout_minutes }}
    # The agent reads the text of the issue, so this job holds no token
    # that writes. The route job acts on its answer.
    permissions:
      contents: read
    outputs:
      kind: ${{ steps.sort.outputs.kind }}
      reason: ${{ steps.sort.outputs.reason }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Get a token of the Lus app that only reads
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.LUS_APP_ID }}
          private-key: ${{ secrets.LUS_APP_PRIVATE_KEY }}
          permission-contents: read
          permission-issues: read
      - name: Gather the issue and the prompt
        id: prompt
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          TITLE: ${{ github.event.issue.title }}
          BODY: ${{ github.event.issue.body }}
        run: |
          dir="$RUNNER_TEMP/triage"
          mkdir -p "$dir"
          printf '# %s\n\n%s\n' "$TITLE" "$BODY" > "$dir/issue.md"
          echo "bot_id=$(gh api "users/$APP_SLUG[bot]" --jq .id)" >> "$GITHUB_OUTPUT"
          {
            echo "text<<LUS_PROMPT_END"
            sed "s|ISSUE_DIR|$dir|g" tools/ci/prompts/triage.md
            echo "LUS_PROMPT_END"
          } >> "$GITHUB_OUTPUT"
      # The author of an outside issue has no write access. The gate has
      # already checked the issue, so the action admits every author. The
      # agent holds a token that only reads, can only read files, and
      # answers in the schema.
      - name: Sort
        id: agent
        # v1.0.281, chosen on 2026-11-25.
        uses: anthropics/claude-code-action@e5812cd75691ca7bbfc57c0ecf4441db3a1ab7dd # v1.0.281
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ steps.app.outputs.token }}
          bot_name: ${{ steps.app.outputs.app-slug }}[bot]
          bot_id: ${{ steps.prompt.outputs.bot_id }}
          prompt: ${{ steps.prompt.outputs.text }}
          allowed_non_write_users: "*"
          allow_fork_prs: "false"
          restrict_untrusted_prs: "true"
          show_full_output: "false"
          display_report: "false"
          claude_args: >-
            --model ${{ fromJSON(needs.gate.outputs.agents).triage.model }}
            --max-turns ${{ fromJSON(needs.gate.outputs.agents).triage.max_turns }}
            --max-budget-usd ${{ fromJSON(needs.gate.outputs.agents).triage.budget_usd }}
            --tools ${{ join(fromJSON(needs.gate.outputs.agents).triage.tools, ',') }}
            --allowedTools ${{ join(fromJSON(needs.gate.outputs.agents).triage.tools, ',') }}
            --disallowedTools ${{ join(fromJSON(needs.gate.outputs.agents).triage.denied_tools, ',') }}
            --add-dir ${{ runner.temp }}/triage
            --setting-sources user --strict-mcp-config
            --json-schema '{"type":"object","properties":{"kind":{"type":"string","enum":["bug","suggestion","design","question","other"]},"reason":{"type":"string"}},"required":["kind","reason"]}'
      - name: Read the answer
        id: sort
        env:
          ANSWER: ${{ steps.agent.outputs.structured_output }}
        run: |
          kind=$(printf '%s' "$ANSWER" | jq -r '.kind // "other"' 2> /dev/null || echo other)
          reason=$(printf '%s' "$ANSWER" | jq -r '.reason // ""' 2> /dev/null || true)
          case "$kind" in bug|suggestion|design|question|other) ;; *) kind=other ;; esac
          echo "kind=$kind" >> "$GITHUB_OUTPUT"
          # One line of plain text, which the route job quotes.
          reason=$(printf '%s' "$reason" | tr -d '\r' | tr '\n' ' ' | cut -c1-300)
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          echo "$kind: $reason"

  route:
    name: Move the issue to Discussions
    needs: [gate, triage]
    if: ${{ contains(fromJSON('["suggestion", "design", "question"]'), needs.triage.outputs.kind) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Get a token of the Lus app
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.LUS_APP_ID }}
          private-key: ${{ secrets.LUS_APP_PRIVATE_KEY }}
          permission-issues: write
          permission-discussions: write
      - name: Move, close, and lock
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}
          KIND: ${{ needs.triage.outputs.kind }}
          REASON: ${{ needs.triage.outputs.reason }}
          CATEGORY: ${{ fromJSON(needs.gate.outputs.agents).discussions[needs.triage.outputs.kind] }}
        run: |
          case "$KIND" in
            question) text="Follow your question at DISCUSSION_URL. Ask questions in Discussions. Open issues only for bug reports." ;;
            *) text="Follow your idea at DISCUSSION_URL. Bring ideas and language design to Discussions. Open issues only for bug reports." ;;
          esac
          printf '%s If you meant to report a bug, open a new issue with the bug form and a program that shows it.\n\nThe triage agent read your issue this way: %s\n' "$text" "$REASON" > "$RUNNER_TEMP/moved.md"
          node tools/ci/gate.mjs discuss "${{ needs.gate.outputs.number }}" "$CATEGORY" "$RUNNER_TEMP/moved.md"

  reproduce:
    name: Run the program of the report
    needs: [gate, triage]
    if: ${{ needs.triage.outputs.kind == 'bug' }}
    # No secret reaches this job, and its token only reads, since it runs a
    # program from the issue.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Build
        timeout-minutes: 15
        working-directory: runtime
        run: zig build -Doptimize=ReleaseSafe
      - name: Run under each mode of the JIT
        env:
          TITLE: ${{ github.event.issue.title }}
          BODY: ${{ github.event.issue.body }}
        run: |
          out="$RUNNER_TEMP/report"
          mkdir -p "$out"
          printf '# %s\n\n%s\n' "$TITLE" "$BODY" > "$out/issue.md"
          node tools/ci/issue.mjs "$out/issue.md" "$out"
          {
            if [ -f "$out/repro.lus" ]; then
              for mode in off default eager; do
                echo "## LUS_JIT=$mode"
                echo
                echo '```'
                if [ "$mode" = default ]; then unset LUS_JIT; else export LUS_JIT=$mode; fi
                status=0
                (cd "$RUNNER_TEMP" && timeout 30 "$GITHUB_WORKSPACE/runtime/zig-out/bin/lus" "$out/repro.lus") > "$RUNNER_TEMP/run.txt" 2>&1 || status=$?
                head -c 20000 "$RUNNER_TEMP/run.txt"
                echo
                echo "exit status $status"
                echo '```'
                echo
              done
            else
              echo "The report holds no program."
            fi
          } > "$out/runs.md"
          cat "$out/runs.md"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: report
          path: ${{ runner.temp }}/report
          retention-days: 7

  hunt:
    name: Look for the cause
    needs: [gate, reproduce]
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ fromJSON(needs.gate.outputs.agents).hunt.timeout_minutes }}
    # The agent reads the report, so this job holds no token that writes.
    # The verify and publish jobs test and land its fix.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: report
          path: ${{ runner.temp }}/report
      - name: Get a token of the Lus app that only reads
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.LUS_APP_ID }}
          private-key: ${{ secrets.LUS_APP_PRIVATE_KEY }}
          permission-contents: read
          permission-issues: read
      - name: Prepare the prompt
        id: prompt
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          echo "bot_id=$(gh api "users/$APP_SLUG[bot]" --jq .id)" >> "$GITHUB_OUTPUT"
          {
            echo "text<<LUS_PROMPT_END"
            sed "s|REPORT_DIR|$RUNNER_TEMP/report|g" tools/ci/prompts/hunt.md
            echo "LUS_PROMPT_END"
          } >> "$GITHUB_OUTPUT"
      # The reporter has no write access. The gate has already checked the
      # issue, so the action admits every author. The agent reads and edits
      # files and runs nothing, so text in the report cannot make it reach
      # a secret or the network. It makes no commit and no push.
      - name: Hunt
        continue-on-error: true
        # v1.0.281, chosen on 2026-11-25.
        uses: anthropics/claude-code-action@e5812cd75691ca7bbfc57c0ecf4441db3a1ab7dd # v1.0.281
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ steps.app.outputs.token }}
          bot_name: ${{ steps.app.outputs.app-slug }}[bot]
          bot_id: ${{ steps.prompt.outputs.bot_id }}
          prompt: ${{ steps.prompt.outputs.text }}
          allowed_non_write_users: "*"
          allow_fork_prs: "false"
          restrict_untrusted_prs: "true"
          show_full_output: "false"
          display_report: "false"
          claude_args: >-
            --model ${{ fromJSON(needs.gate.outputs.agents).hunt.model }}
            --max-turns ${{ fromJSON(needs.gate.outputs.agents).hunt.max_turns }}
            --max-budget-usd ${{ fromJSON(needs.gate.outputs.agents).hunt.budget_usd }}
            --tools ${{ join(fromJSON(needs.gate.outputs.agents).hunt.tools, ',') }}
            --allowedTools ${{ join(fromJSON(needs.gate.outputs.agents).hunt.tools, ',') }}
            --disallowedTools ${{ join(fromJSON(needs.gate.outputs.agents).hunt.denied_tools, ',') }}
            --add-dir ${{ runner.temp }}/report
            --setting-sources user --strict-mcp-config
      - name: Collect the fix
        run: |
          git add -N .
          git diff > "$RUNNER_TEMP/report/fix.patch"
          [ -f "$RUNNER_TEMP/report/verdict.json" ] || echo '{"found": false, "test": "", "subject": ""}' > "$RUNNER_TEMP/report/verdict.json"
          [ -f "$RUNNER_TEMP/report/report.md" ] || echo "The agent wrote no report." > "$RUNNER_TEMP/report/report.md"
      - name: The outputs hold no secret
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          APP_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          for secret in "$ANTHROPIC_API_KEY" "$APP_TOKEN"; do
            if [ -n "$secret" ] && grep -rqF "$secret" "$RUNNER_TEMP/report"; then echo "an output holds a secret" >&2; exit 1; fi
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hunt
          path: |
            ${{ runner.temp }}/report/fix.patch
            ${{ runner.temp }}/report/verdict.json
            ${{ runner.temp }}/report/report.md
          retention-days: 14

  verify:
    name: Test the fix
    needs: [gate, hunt]
    # The regression test must fail on the default branch and pass with the
    # fix, and the tests of the areas of the fix must pass. No secret
    # reaches this job.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      verified: ${{ steps.verify.outputs.verified }}
      found: ${{ steps.verify.outputs.found }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: hunt
          path: ${{ runner.temp }}/hunt
      - name: Verify
        id: verify
        run: |
          set -u
          hunt="$RUNNER_TEMP/hunt"
          found=$(jq -r '.found == true' "$hunt/verdict.json")
          test=$(jq -r '.test // ""' "$hunt/verdict.json")
          echo "found=$found" >> "$GITHUB_OUTPUT"
          fail() { echo "$1" | tee -a "$hunt/report.md" >&2; echo "verified=false" >> "$GITHUB_OUTPUT"; exit 0; }
          [ "$found" = true ] || fail ""
          [ -s "$hunt/fix.patch" ] || fail "CI found no change in the fix."
          files=$(git apply --numstat "$hunt/fix.patch" | cut -f3)
          for f in $files; do
            case "$f" in runtime/src/*|tests/conformance/*) ;; *) fail "CI refused the fix, which changes $f." ;; esac
          done
          case "$test" in tests/conformance/*_test.lus) ;; *) fail "CI found no regression test in the verdict." ;; esac
          # The new test without the fix of the sources must fail.
          git apply --include="$test" "$hunt/fix.patch"
          (cd runtime && zig build -Doptimize=ReleaseSafe)
          if (cd runtime && zig-out/bin/lus test "../$test" > "$RUNNER_TEMP/before.txt" 2>&1); then fail "The regression test passes without the fix, so it does not show the bug."; fi
          git checkout -- . && git clean -fdq -- tests runtime/src
          git apply "$hunt/fix.patch"
          (cd runtime && zig build -Doptimize=ReleaseSafe) || fail "The runtime does not build with the fix."
          plan=$(node tools/ci/areas.mjs plan --files $files)
          tests=$(echo "$plan" | jq -r '.runtime[] | select(.os == "linux") | .tests')
          for mode in off default eager opt-eager; do
            if [ "$mode" = default ]; then unset LUS_JIT; else export LUS_JIT=$mode; fi
            (cd runtime && zig-out/bin/lus test "../$test" $tests) > "$RUNNER_TEMP/after-$mode.txt" 2>&1 || fail "The tests fail with the fix under LUS_JIT=$mode."
          done
          echo "verified=true" >> "$GITHUB_OUTPUT"
          printf '\nCI checked that the regression test fails without the fix and passes with it, and that the tests of the areas of the fix pass in every mode of the JIT.\n' >> "$hunt/report.md"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified
          path: ${{ runner.temp }}/hunt
          retention-days: 14

  publish:
    name: Open the pull request of the fix
    needs: [gate, verify]
    if: ${{ !cancelled() && needs.verify.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Get a token of the Lus app
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.LUS_APP_ID }}
          private-key: ${{ secrets.LUS_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      # The app token pushes the branch, so the pull request runs ci.yml.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ steps.app.outputs.token }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verified
          path: ${{ runner.temp }}/hunt
      - name: Push the branch, open the pull request, and report
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          NUMBER: ${{ needs.gate.outputs.number }}
          VERIFIED: ${{ needs.verify.outputs.verified }}
          FOUND: ${{ needs.verify.outputs.found }}
          MODEL: ${{ fromJSON(needs.gate.outputs.agents).hunt.model }}
        run: |
          hunt="$RUNNER_TEMP/hunt"
          if [ "$VERIFIED" != true ]; then
            node tools/ci/gate.mjs comment "$NUMBER" "$hunt/report.md" "<!-- lus-hunt -->"
            if [ "$FOUND" != true ]; then gh issue edit "$NUMBER" --repo "$GITHUB_REPOSITORY" --add-label not-reproduced || true; fi
            exit 0
          fi
          subject=$(jq -r '.subject // ""' "$hunt/verdict.json")
          printf '%s\n' "$subject" > "$RUNNER_TEMP/subject.txt"
          if ! node tools/ci/commits.mjs message "$RUNNER_TEMP/subject.txt"; then subject="fix(runtime): fix the bug of issue $NUMBER"; fi
          user_id=$(gh api "users/$APP_SLUG[bot]" --jq .id)
          branch="agent/issue-$NUMBER"
          git switch -c "$branch"
          git apply "$hunt/fix.patch"
          git add -A runtime/src tests/conformance
          git -c user.name="$APP_SLUG[bot]" -c user.email="$user_id+$APP_SLUG[bot]@users.noreply.github.com" \
            commit -q -F - << EOF
          $subject

          An agent found this fix for issue #$NUMBER, and CI checked its regression test.

          Co-Authored-By: Claude <noreply@anthropic.com>
          EOF
          git push --force origin "$branch"
          # The description follows .github/PULL_REQUEST_TEMPLATE.md.
          {
            printf '## Kind\n\nbug\n\n## Agent disclosure\n\nAgent: Claude\nModel: %s\nHarness: Claude Code\n\n' "$MODEL"
            printf '## Linked issues\n\nFixes #%s\n\n## Test evidence\n\n' "$NUMBER"
            cat "$hunt/report.md"
          } > "$RUNNER_TEMP/pr.md"
          url=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --state open --json url --jq '.[0].url // empty')
          if [ -z "$url" ]; then
            url=$(gh pr create --repo "$GITHUB_REPOSITORY" --head "$branch" --base "${{ github.event.repository.default_branch }}" --title "$subject" --body-file "$RUNNER_TEMP/pr.md" --draft)
          fi
          printf '\nFollow the fix and its review in %s.\n' "$url" >> "$hunt/report.md"
          node tools/ci/gate.mjs comment "$NUMBER" "$hunt/report.md" "<!-- lus-hunt -->"
          gh issue edit "$NUMBER" --repo "$GITHUB_REPOSITORY" --add-label agent-fix || true
