name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - ".github/workflows/build.yml"
      - "CHANGELOG.md"
      - "licenses/**"
      - "lus-install/**"
      - "lus-language/**"
      - "lus-site/**"
      - "lus-spec/**"
      - "lus-tests/**"
      - "lus-vscode/**"
      - "lus/**"
      - "release/**"
      - "scripts/**"
      - "THIRD_PARTY_NOTICES.md"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/build.yml"
      - "CHANGELOG.md"
      - "licenses/**"
      - "lus-install/**"
      - "lus-language/**"
      - "lus-site/**"
      - "lus-spec/**"
      - "lus-tests/**"
      - "lus-vscode/**"
      - "lus/**"
      - "release/**"
      - "scripts/**"
      - "THIRD_PARTY_NOTICES.md"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MESON_VERSION: "1.11.2"
  NINJA_VERSION: "1.13.0"
  NODE_VERSION: "24.7.0"
  PNPM_VERSION: "10.18.0"
  EMSCRIPTEN_VERSION: "3.1.74"
  SHELLCHECK_VERSION: "0.9.0"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare "pnpm@$PNPM_VERSION" --activate
      - name: Require the pinned ShellCheck version
        run: |
          actual=$(shellcheck --version | awk '/^version:/ { print $2 }')
          test "$actual" = "$SHELLCHECK_VERSION"
      - name: Run repository lint
        run: bash scripts/lint.sh
      - name: Validate stable tag metadata and release notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: >-
          python3 scripts/release.py stable-release
          --tag "$GITHUB_REF_NAME"
          --commit "$GITHUB_SHA"
          --notes-output release-notes.md
      - name: Record lint evidence
        run: python3 scripts/release.py status --name lint --status "${{ job.status }}" --output evidence/lint.json
      - name: Upload lint evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: evidence-lint
          path: evidence/lint.json
          if-no-files-found: error

  test:
    name: Test (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container || null }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-glibc-x64
            runner: ubuntu-24.04
            suites: "--suite h1 --suite h2 --suite h3-ci"
          - platform: linux-musl-x64
            runner: ubuntu-24.04
            container: alpine:3.22.1@sha256:4bcff63911fcb4448bd4fdacec207030997caf25e9bea4045fa6c8c44de311d1
            suites: "--suite h1 --suite h2 --suite h3-ci"
          - platform: macos-arm64
            runner: macos-14
            suites: "--suite h1 --suite h2 --suite h3-ci"
          - platform: windows-x64
            runner: windows-2025
            suites: "--suite h1 --suite h2 --suite h3-ci"
    steps:
      - name: Install Alpine bootstrap
        if: matrix.container != null
        run: apk add --no-cache bash build-base git python3 py3-pip py3-virtualenv openssl-dev c-ares-dev zlib-dev zstd-dev brotli-dev lz4-dev
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up MSVC
        if: matrix.platform == 'windows-x64'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
      - name: Install Ubuntu dependencies
        if: matrix.platform == 'linux-glibc-x64'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv llvm libssl-dev libc-ares-dev zlib1g-dev libzstd-dev libbrotli-dev liblz4-dev
      - name: Install macOS dependencies
        if: matrix.platform == 'macos-arm64'
        run: brew install readline openssl@3 c-ares zstd brotli lz4
      - name: Install Windows dependencies
        if: matrix.platform == 'windows-x64'
        shell: pwsh
        run: |
          python -m pip install "meson==$env:MESON_VERSION" "ninja==$env:NINJA_VERSION"
          choco install pkgconfiglite --version 0.28 --no-progress --yes
          vcpkg install --x-manifest-root=release --triplet=x64-windows
          "PKG_CONFIG_PATH=$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\lib\pkgconfig" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Install pinned Meson and Ninja
        if: matrix.platform != 'windows-x64'
        shell: bash
        run: |
          python3 -m venv .ci-tools
          .ci-tools/bin/pip install "meson==$MESON_VERSION" "ninja==$NINJA_VERSION"
          echo "$PWD/.ci-tools/bin" >> "$GITHUB_PATH"
      - name: Configure and build tests
        shell: bash
        run: |
          meson setup "lus/build-${{ matrix.platform }}" lus --buildtype=debug
          meson compile -C "lus/build-${{ matrix.platform }}"
      - name: Run tests
        shell: bash
        run: meson test -C "lus/build-${{ matrix.platform }}" -v --print-errorlogs ${{ matrix.suites }}
      - name: Record test evidence
        shell: bash
        run: |
          python3 scripts/release.py collect-meson \
            --kind test \
            --name "${{ matrix.platform }}" \
            --status "${{ job.status }}" \
            --log "lus/build-${{ matrix.platform }}/meson-logs/testlog.json" \
            --output "evidence/test-${{ matrix.platform }}.json"
      - name: Upload test evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: evidence-test-${{ matrix.platform }}
          path: evidence/test-${{ matrix.platform }}.json
          if-no-files-found: error

  sanitize:
    name: ASAN, UBSAN, and TSan qualification
    needs: [lint, test]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-rt-dev curl make pkg-config python3-venv llvm libssl-dev zlib1g-dev libzstd-dev libbrotli-dev liblz4-dev
          python3 -m venv .ci-tools
          .ci-tools/bin/pip install "meson==$MESON_VERSION" "ninja==$NINJA_VERSION"
          echo "$PWD/.ci-tools/bin" >> "$GITHUB_PATH"
      - name: Build release-pinned c-ares for sanitizers
        shell: bash
        run: |
          cares_root="$RUNNER_TEMP/sanitizer-cares"
          cares_pc=$(lus-tests/h4/build_pinned_cares.sh "$cares_root")
          cares_version=$(python3 scripts/release.py dependency caresSource.version)
          actual_version=$(PKG_CONFIG_PATH="$cares_pc" pkg-config --modversion libcares)
          test "$actual_version" = "$cares_version"
          echo "PKG_CONFIG_PATH=$cares_pc${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" >> "$GITHUB_ENV"
          echo "SANITIZER_CARES_SOURCE_ARCHIVE=$cares_root/c-ares-$cares_version.tar.gz" >> "$GITHUB_ENV"
      - name: Qualify H1 and H2 with ASAN and UBSAN
        run: >-
          bash lus-tests/qualify-sanitizers.sh
          "$PWD/lus/build-sanitize"
          "$RUNNER_TEMP/address-undefined-evidence.json"
      - name: Qualify worker ownership with TSan
        run: bash lus-tests/qualify-tsan.sh "$PWD/lus/build-thread"
      - name: Record combined sanitizer evidence
        run: |
          python3 lus-tests/qualification.py sanitizer-evidence \
            --build-dir "$PWD/lus/build-sanitize" \
            --thread-build-dir "$PWD/lus/build-thread" \
            --leak-probe "$PWD/lus/build-sanitize/leak-detection-probe.log" \
            --output evidence/sanitizer.json
      - name: Upload sanitizer evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: evidence-sanitizer
          path: evidence/sanitizer.json
          if-no-files-found: error

  benchmark:
    name: H4 release qualification
    needs: [lint, test]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl make python3-venv libssl-dev zlib1g-dev libzstd-dev libbrotli-dev liblz4-dev
          python3 -m venv .ci-tools
          .ci-tools/bin/pip install "meson==$MESON_VERSION" "ninja==$NINJA_VERSION"
          echo "$PWD/.ci-tools/bin" >> "$GITHUB_PATH"
      - name: Build release-pinned c-ares for both H4 runtimes
        shell: bash
        run: |
          cares_root="$RUNNER_TEMP/h4-cares"
          cares_pc=$(lus-tests/h4/build_pinned_cares.sh "$cares_root")
          cares_version=$(python3 scripts/release.py dependency caresSource.version)
          echo "PKG_CONFIG_PATH=$cares_pc${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" >> "$GITHUB_ENV"
          echo "H4_CARES_SOURCE_ARCHIVE=$cares_root/c-ares-$cares_version.tar.gz" >> "$GITHUB_ENV"
      - name: Validate H4 inventory and evidence rules
        run: |
          python3 lus-tests/h4/harness.py validate
          python3 lus-tests/h4/test_harness.py
      - name: Build benchmark runtime
        run: |
          meson setup lus/build-benchmark lus \
            --buildtype=release \
            -Doptimization=3 \
            -Db_lto=true \
            -Db_pgo=off
          meson compile -C lus/build-benchmark 'lus:executable'
      - name: Prepare matching Lus 1.6.2 baseline
        shell: bash
        run: |
          mkdir -p evidence/h4
          baseline_binary=$(lus-tests/h4/prepare_baseline.sh \
            "$RUNNER_TEMP/lus-h4-v1.6.2" \
            --candidate-build lus/build-benchmark \
            --evidence evidence/h4/build-parity.json \
            --cares-source-archive "$H4_CARES_SOURCE_ARCHIVE")
          printf 'H4_BASELINE=%s\n' "$baseline_binary" >> "$GITHUB_ENV"
      - name: Capture raw paired benchmark evidence
        shell: bash
        run: |
          set +e
          python3 lus-tests/h4/harness.py release \
            --baseline "$H4_BASELINE" \
            --candidate lus/build-benchmark/lus \
            --json evidence/h4/release.json \
            --markdown evidence/h4/release.md
          release_status=$?
          python3 lus-tests/h4/harness.py fastcall \
            --binary lus/build-benchmark/lus \
            --json evidence/h4/fastcall.json \
            --markdown evidence/h4/fastcall.md
          fastcall_status=$?
          python3 lus-tests/h4/harness.py ingest \
            --parity evidence/h4/build-parity.json \
            --release evidence/h4/release.json \
            --fastcall evidence/h4/fastcall.json \
            --output evidence/benchmarks.json
          ingest_status=$?
          set -e
          printf 'release=%s\nfastcall=%s\ningest=%s\n' \
            "$release_status" "$fastcall_status" "$ingest_status" \
            > evidence/h4/exit-status.txt
      - name: Upload benchmark evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: evidence-benchmarks
          path: evidence/benchmarks.json
          if-no-files-found: error
      - name: Upload raw H4 reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: h4-raw-benchmarks
          path: evidence/h4
          if-no-files-found: error
      - name: Enforce H4 release gates
        run: |
          python3 lus-tests/h4/harness.py enforce \
            --evidence evidence/benchmarks.json

  build:
    name: Build (${{ matrix.platform }})
    needs: [lint, test]
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container || null }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-glibc-x64
            runner: ubuntu-24.04
            pgo: true
            setup_args: "--prefer-static"
          - platform: linux-musl-x64
            runner: ubuntu-24.04
            container: alpine:3.22.1@sha256:4bcff63911fcb4448bd4fdacec207030997caf25e9bea4045fa6c8c44de311d1
            pgo: false
            setup_args: "--prefer-static -Dc_link_args=-static"
          - platform: macos-arm64
            runner: macos-14
            pgo: true
            setup_args: "--prefer-static"
          - platform: windows-x64
            runner: windows-2025
            pgo: false
            setup_args: "--prefer-static -Db_vscrt=mt"
    steps:
      - name: Install Alpine bootstrap
        if: matrix.container != null
        run: apk add --no-cache bash build-base curl file git python3 py3-pip py3-virtualenv openssl-dev openssl-libs-static c-ares-dev zlib-dev zlib-static zstd-dev zstd-static brotli-dev brotli-static lz4-dev lz4-static
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Set up MSVC
        if: matrix.platform == 'windows-x64'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
      - name: Install Ubuntu dependencies
        if: matrix.platform == 'linux-glibc-x64'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv llvm libssl-dev libc-ares-dev zlib1g-dev libzstd-dev libbrotli-dev liblz4-dev
      - name: Install macOS dependencies
        if: matrix.platform == 'macos-arm64'
        run: brew install readline openssl@3 c-ares zstd brotli lz4
      - name: Install Windows dependencies
        if: matrix.platform == 'windows-x64'
        shell: pwsh
        run: |
          python -m pip install "meson==$env:MESON_VERSION" "ninja==$env:NINJA_VERSION"
          choco install pkgconfiglite --version 0.28 --no-progress --yes
          vcpkg install --x-manifest-root=release --triplet=x64-windows-static
          "PKG_CONFIG_PATH=$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows-static\lib\pkgconfig" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Install pinned Meson and Ninja
        if: matrix.platform != 'windows-x64'
        shell: bash
        run: |
          python3 -m venv .ci-tools
          .ci-tools/bin/pip install "meson==$MESON_VERSION" "ninja==$NINJA_VERSION"
          echo "$PWD/.ci-tools/bin" >> "$GITHUB_PATH"
      - name: Build pinned static c-ares
        if: matrix.platform != 'windows-x64'
        shell: bash
        run: |
          cares_pc=$(lus-tests/h4/build_pinned_cares.sh \
            "$RUNNER_TEMP/release-cares-${{ matrix.platform }}")
          echo "PKG_CONFIG_PATH=$cares_pc${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" >> "$GITHUB_ENV"
      - name: Build pinned static c-ares on Windows
        if: matrix.platform == 'windows-x64'
        shell: pwsh
        run: |
          $version = python scripts/release.py dependency caresSource.version
          $url = python scripts/release.py dependency caresSource.url
          $expected = python scripts/release.py dependency caresSource.sha256
          $archive = Join-Path $env:RUNNER_TEMP "c-ares-$version.tar.gz"
          $source = Join-Path $env:RUNNER_TEMP "c-ares-$version"
          $build = Join-Path $env:RUNNER_TEMP "c-ares-build"
          $install = Join-Path $env:RUNNER_TEMP "c-ares-install"
          Invoke-WebRequest -Uri $url -OutFile $archive
          $actual = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "c-ares source SHA-256 mismatch"
          }
          tar -C $env:RUNNER_TEMP -xzf $archive
          cmake -S $source -B $build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_INSTALL_PREFIX=$install `
            -DCARES_STATIC=ON `
            -DCARES_SHARED=OFF `
            -DCARES_BUILD_TESTS=OFF `
            -DCARES_BUILD_TOOLS=OFF
          cmake --build $build
          cmake --install $build
          $pc = Join-Path $install "lib\pkgconfig"
          if (-not (Test-Path (Join-Path $pc "libcares.pc"))) {
            throw "pinned c-ares pkg-config metadata is missing"
          }
          "$pc;$env:PKG_CONFIG_PATH" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Build optimized tools with PGO
        if: matrix.pgo
        shell: bash
        run: lus/tools/pgo-build.sh "build-${{ matrix.platform }}" --buildtype=release ${{ matrix.setup_args }}
      - name: Build optimized tools
        if: matrix.pgo != true
        shell: bash
        run: |
          meson setup "lus/build-${{ matrix.platform }}" lus --buildtype=release ${{ matrix.setup_args }}
          meson compile -C "lus/build-${{ matrix.platform }}"
      - name: Validate actual tool versions against lua.h
        shell: bash
        run: |
          suffix=
          if [ "${{ matrix.platform }}" = windows-x64 ]; then
            suffix=.exe
          fi
          python3 scripts/release.py binary-versions \
            --lus "lus/build-${{ matrix.platform }}/lus$suffix" \
            --lusc "lus/build-${{ matrix.platform }}/lusc$suffix"
      - name: Build non-LTO relocatable SDK
        shell: bash
        run: |
          meson setup "lus/build-sdk-${{ matrix.platform }}" lus \
            --buildtype=release \
            --prefix=/lus-sdk \
            -Db_lto=false \
            -Dpkgconfig.relocatable=true \
            ${{ matrix.setup_args }}
          meson compile -C "lus/build-sdk-${{ matrix.platform }}"
          meson install -C "lus/build-sdk-${{ matrix.platform }}" --destdir "$PWD/sdk-stage"
      - name: Assert portable tools on Linux glibc
        if: matrix.platform == 'linux-glibc-x64'
        run: |
          docker run --rm -v "$PWD/lus/build-linux-glibc-x64:/b" debian:12-slim@sha256:88200866dfff7ea7f5cbcb6ec7c8a701889efe6fe859fe64d6990e4b07ea4171 sh -c '
            set -eu
            for tool in lus lusc; do
              ldd "/b/$tool"
              if ldd "/b/$tool" | grep -E "libssl|libcrypto|libcares|libzstd|libbrotli|liblz4|libz[.]so"; then
                exit 1
              fi
              "/b/$tool" -v
            done'
      - name: Assert portable tools on Linux musl
        if: matrix.platform == 'linux-musl-x64'
        shell: bash
        run: |
          for tool in lus lusc; do
            file "lus/build-linux-musl-x64/$tool" | grep -qE 'statically linked|static-pie linked'
            "lus/build-linux-musl-x64/$tool" -v
          done
      - name: Assert portable tools on macOS
        if: matrix.platform == 'macos-arm64'
        shell: bash
        run: |
          for tool in lus lusc; do
            otool -L "lus/build-macos-arm64/$tool"
            if otool -L "lus/build-macos-arm64/$tool" | grep -E '/opt/homebrew|/usr/local|@rpath'; then
              exit 1
            fi
            "lus/build-macos-arm64/$tool" -v
          done
      - name: Assert portable tools on Windows
        if: matrix.platform == 'windows-x64'
        shell: pwsh
        run: |
          foreach ($tool in "lus.exe", "lusc.exe") {
            $path = "lus\build-windows-x64\$tool"
            $dependencies = (dumpbin /dependents $path) -join "`n"
            Write-Host $dependencies
            foreach ($forbidden in "zlib1.dll", "zstd.dll", "cares.dll", "lz4.dll", "brotli", "libcrypto", "libssl", "VCRUNTIME", "MSVCP", "api-ms-win-crt") {
              if ($dependencies -match [regex]::Escape($forbidden)) {
                throw "$tool depends on $forbidden"
              }
            }
            & $path -v
          }
      - name: Assemble platform archive and compatibility tools
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = windows-x64 ]; then
            metadata_file=$(find sdk-stage -type f -path '*/lib/cmake/Lus/LusConfig.cmake' -print -quit)
            test -n "$metadata_file"
            sdk_root=$(cd "$(dirname "$metadata_file")/../../.." && pwd)
          else
            metadata_file=$(find sdk-stage -type f -path '*/lib/pkgconfig/lus.pc' -print -quit)
            test -n "$metadata_file"
            sdk_root=$(cd "$(dirname "$metadata_file")/../.." && pwd)
          fi
          python3 scripts/release.py assemble-platform \
            --platform "${{ matrix.platform }}" \
            --runtime-dir "lus/build-${{ matrix.platform }}" \
            --sdk-root "$sdk_root" \
            --sdk-build-dir "lus/build-sdk-${{ matrix.platform }}" \
            --output "dist-${{ matrix.platform }}"
          version=$(python3 scripts/release.py version)
          extension=tar.gz
          nm_tool=nm
          cmake_args=()
          if [ "${{ matrix.platform }}" = windows-x64 ]; then
            extension=zip
            nm_tool=dumpbin
            cmake_args+=(
              --cmake-toolchain "$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
              --vcpkg-triplet x64-windows-static
            )
          fi
          python3 release/qualification.py archive \
            --archive "dist-${{ matrix.platform }}/lus-$version-${{ matrix.platform }}.$extension" \
            --platform "${{ matrix.platform }}" \
            --nm "$nm_tool" \
            --forbid-path "$PWD" \
            --output "evidence/archive-${{ matrix.platform }}.json" \
            "${cmake_args[@]}"
      - name: Compare the stable 1.6.2 ABI
        if: matrix.platform == 'linux-glibc-x64'
        shell: bash
        run: |
          baseline_root="$RUNNER_TEMP/lus-abi-1.6.2"
          baseline_build="$baseline_root/lus/build-abi"
          mkdir "$baseline_root"
          git archive v1.6.2 | tar -x -C "$baseline_root"
          meson setup "$baseline_build" "$baseline_root/lus" \
            --buildtype=release \
            -Db_lto=false \
            --prefer-static
          meson compile -C "$baseline_build"
          baseline_library=$(find "$baseline_build" -type f -name liblus.a -print -quit)
          test -n "$baseline_library"
          pc_file=$(find sdk-stage -type f -path '*/lib/pkgconfig/lus.pc' -print -quit)
          test -n "$pc_file"
          sdk_root=$(cd "$(dirname "$pc_file")/../.." && pwd)
          python3 release/qualification.py abi \
            --baseline-library "$baseline_library" \
            --candidate-library "$sdk_root/lib/liblus.a" \
            --candidate-prefix "$sdk_root" \
            --platform linux-glibc-x64 \
            --nm llvm-nm \
            --output evidence/abi-linux-glibc-x64.json
      - name: Record toolchain evidence
        shell: bash
        run: |
          provenance=hosted-runner-version-recorded
          if [ "${{ matrix.platform }}" = linux-musl-x64 ]; then
            provenance=immutable-container-version-recorded
          fi
          python3 scripts/release.py environment \
            --platform "${{ matrix.platform }}" \
            --build-dir "lus/build-sdk-${{ matrix.platform }}" \
            --provenance "$provenance" \
            --output "evidence/toolchain-${{ matrix.platform }}.json"
      - name: Upload platform release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.platform }}
          path: dist-${{ matrix.platform }}/*
          if-no-files-found: error
      - name: Upload platform toolchain evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: evidence-toolchain-${{ matrix.platform }}
          path: evidence/toolchain-${{ matrix.platform }}.json
          if-no-files-found: error
      - name: Upload platform archive qualification
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: evidence-archive-${{ matrix.platform }}
          path: evidence/archive-${{ matrix.platform }}.json
          if-no-files-found: error
      - name: Upload ABI qualification
        if: matrix.platform == 'linux-glibc-x64'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: evidence-abi-linux-glibc-x64
          path: evidence/abi-linux-glibc-x64.json
          if-no-files-found: error

  build-wasm:
    name: Build WASM
    needs: lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: mymindstorm/setup-emsdk@6ab9eb1bda2574c4ddb79809fc9247783eaf9021 # v14
        with:
          version: ${{ env.EMSCRIPTEN_VERSION }}
      - name: Build WASM
        run: |
          mkdir -p evidence
          LUS_WASM_NODE_WASM_PROOF="$PWD/evidence/lus.node.wasm" lus/wasm/build.sh
      - name: Assemble WASM archive
        run: python3 scripts/release.py assemble-tree --component wasm --input lus/wasm/dist --output dist-wasm
      - name: Record exact WASM inputs
        run: >-
          python3 scripts/release.py wasm-evidence
          --dist lus/wasm/dist
          --embedded-tree lus-language
          --node-wasm-proof evidence/lus.node.wasm
          --output evidence/wasm.json
      - name: Record WASM toolchain evidence
        run: >-
          python3 scripts/release.py environment
          --platform wasm
          --provenance hosted-runner-pinned-emscripten
          --output evidence/toolchain-wasm.json
      - name: Upload WASM release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-wasm
          path: dist-wasm/*
          if-no-files-found: error
      - name: Upload WASM toolchain evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: evidence-toolchain-wasm
          path: evidence/toolchain-wasm.json
          if-no-files-found: error
      - name: Upload exact WASM evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: evidence-wasm
          path: evidence/wasm.json
          if-no-files-found: error

  build-vscode:
    name: Build VSIX
    needs: [lint, build-wasm]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare "pnpm@$PNPM_VERSION" --activate
      - name: Download exact WASM candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-wasm
          path: wasm-candidate
      - name: Install extension dependencies
        run: pnpm --dir lus-vscode install --frozen-lockfile
      - name: Stage WASM and build extension
        run: |
          mkdir -p lus-vscode/wasm
          cp wasm-candidate/lus.node.js lus-vscode/wasm/lus.mjs
          cp wasm-candidate/lus.wasm lus-vscode/wasm/lus.wasm
          cmp wasm-candidate/lus.node.js lus-vscode/wasm/lus.mjs
          cmp wasm-candidate/lus.wasm lus-vscode/wasm/lus.wasm
          pnpm --dir lus-vscode run test:wasm
          pnpm --dir lus-vscode run ci
          pnpm --dir lus-vscode check:package
      - name: Qualify the remote Dev Container workspace
        run: pnpm --dir lus-vscode run test:devcontainer
      - name: Package exact VSIX and Open VSX publisher
        run: |
          version=$(python3 scripts/release.py version)
          raw_one="$RUNNER_TEMP/lus-vscode-one.vsix"
          raw_two="$RUNNER_TEMP/lus-vscode-two.vsix"
          normalized_two="$RUNNER_TEMP/lus-vscode-two-normalized.vsix"
          TZ=UTC SOURCE_DATE_EPOCH=315532800 pnpm --dir lus-vscode exec vsce package --no-dependencies --out "$raw_one"
          TZ=Etc/GMT+8 SOURCE_DATE_EPOCH=1788048000 pnpm --dir lus-vscode exec vsce package --no-dependencies --out "$raw_two"
          test -s "$raw_one"
          test -s "$raw_two"
          if cmp -s "$raw_one" "$raw_two"; then
            echo "VSIX envelope perturbation did not change the raw package" >&2
            exit 1
          fi
          python3 scripts/release.py normalize-vsix --input "$raw_one" --output "$PWD/lus-$version.vsix"
          python3 scripts/release.py normalize-vsix --input "$raw_two" --output "$normalized_two"
          cmp "$PWD/lus-$version.vsix" "$normalized_two"
          node lus-vscode/scripts/build-open-vsx-publisher.mjs "$PWD/open-vsx-publisher.cjs"
          publisher_version=$(node "$PWD/open-vsx-publisher.cjs" --version)
          test "$publisher_version" = "$(python3 scripts/release.py dependency ovsx)"
          publisher_sha=$(sha256sum "$PWD/open-vsx-publisher.cjs" | awk '{ print $1 }')
          test "$publisher_sha" = "$(python3 scripts/release.py publisher-sha256)"
          python3 scripts/release.py copy-component --component vscode --source "lus-$version.vsix" --output dist-vscode
          python3 scripts/release.py copy-component --component vscodePublisher --source open-vsx-publisher.cjs --output dist-vscode
          python3 scripts/release.py vsix-evidence \
            --vsix "dist-vscode/lus-$version.vsix" \
            --publisher "dist-vscode/lus-$version-open-vsx-publisher.cjs" \
            --node-js lus-vscode/wasm/lus.mjs \
            --wasm lus-vscode/wasm/lus.wasm \
            --output evidence/vscode.json
      - name: Upload VSIX and publisher release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-vscode
          path: dist-vscode/*
          if-no-files-found: error
      - name: Upload VSIX evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: evidence-vscode
          path: evidence/vscode.json
          if-no-files-found: error

  build-site:
    name: Build site artifact
    needs: [lint, build-wasm]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare "pnpm@$PNPM_VERSION" --activate
      - name: Download exact WASM candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-wasm
          path: lus/wasm/dist
      - name: Install site dependencies
        run: pnpm --dir lus-site install --frozen-lockfile
      - name: Run the complete site test suite
        run: pnpm --dir lus-site test
      - name: Build with the exact local WASM candidate
        working-directory: lus-site
        env:
          LUS_WASM_ARTIFACT_DIR: ../lus/wasm/dist
        run: pnpm build:local-wasm
      - name: Assemble site archive
        run: python3 scripts/release.py assemble-tree --component site --input lus-site/dist --output dist-site
      - name: Record site evidence
        run: python3 scripts/release.py status --name site --status "${{ job.status }}" --output evidence/site.json
      - name: Upload site release asset
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-site
          path: dist-site/*
          if-no-files-found: error
      - name: Upload site evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: evidence-site
          path: evidence/site.json
          if-no-files-found: error

  windows-installer:
    name: Build Windows installer
    needs: build
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install exact Inno Setup toolchain
        shell: pwsh
        run: >-
          choco install innosetup
          --version 6.7.1
          --allow-downgrade
          --no-progress
          --yes
      - name: Download Windows tools
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-windows-x64
          path: windows-candidate
      - name: Stage installer inputs
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          $compilerVersion = (Get-Item $compiler).VersionInfo.ProductVersion
          if ($compilerVersion -notmatch "^6\.7\.1(?:\.|$)") {
            throw "unexpected Inno Setup compiler version: $compilerVersion"
          }
          "INNO_SETUP_ACTUAL=$compilerVersion" | Out-File $env:GITHUB_ENV -Append
          Copy-Item windows-candidate\lus-windows.exe lus-install\lus.exe
          Copy-Item windows-candidate\lusc-windows.exe lus-install\lusc.exe
          $version = python scripts/release.py version
          & $compiler /DAppVer="$version" /Olus-install\out lus-install\lus.iss
      - name: Silent install smoke test
        shell: pwsh
        run: |
          Start-Process -Wait lus-install\out\lus-setup.exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/LOG=setup.log'
          foreach ($tool in "lus.exe", "lusc.exe") {
            $path = "$env:LOCALAPPDATA\Programs\Lus\$tool"
            if (-not (Test-Path $path)) {
              Get-Content setup.log
              throw "$tool was not installed"
            }
            & $path -v
          }
          $userPath = (Get-ItemProperty HKCU:\Environment).Path
          if ($userPath -notlike "*\Programs\Lus*") {
            throw "user PATH was not updated"
          }
      - name: Silent uninstall test
        shell: pwsh
        run: |
          Start-Process -Wait "$env:LOCALAPPDATA\Programs\Lus\unins000.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES'
          $deadline = (Get-Date).AddSeconds(90)
          while ($true) {
            $lusGone = -not (Test-Path "$env:LOCALAPPDATA\Programs\Lus\lus.exe")
            $luscGone = -not (Test-Path "$env:LOCALAPPDATA\Programs\Lus\lusc.exe")
            $userPath = (Get-ItemProperty HKCU:\Environment -ErrorAction SilentlyContinue).Path
            $pathClean = $userPath -notlike "*\Programs\Lus*"
            if ($lusGone -and $luscGone -and $pathClean) {
              break
            }
            if ((Get-Date) -gt $deadline) {
              throw "uninstall did not complete"
            }
            Start-Sleep -Seconds 2
          }
      - name: Assemble installer assets
        shell: pwsh
        run: |
          python scripts/release.py copy-component --component windowsInstaller --source lus-install\out\lus-setup.exe --output dist-installer
          python scripts/release.py status --name windows-installer --status success --detail "innoSetup=$env:INNO_SETUP_ACTUAL" --output evidence/windows-installer.json
      - name: Upload Windows installer assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-windows-installer
          path: dist-installer/*
          if-no-files-found: error
      - name: Upload Windows installer evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: evidence-windows-installer
          path: evidence/windows-installer.json
          if-no-files-found: error

  unix-installer:
    name: Qualify and package Unix installer
    needs: [lint, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Download exact Linux installer inputs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-linux-glibc-x64
          path: unix-candidate
      - name: Run deterministic HTTPS installer qualification
        run: >-
          python3 lus-install/test_install.py
          --installer lus-install/install.sh
          --lus unix-candidate/lus-linux
          --lusc unix-candidate/lusc-linux
      - name: Validate and package install.sh
        run: |
          sh -n lus-install/install.sh
          python3 scripts/release.py copy-component --component unixInstaller --source lus-install/install.sh --output dist-installer
          python3 scripts/release.py status --name unix-installer --status success --detail fixture=local-https --output evidence/unix-installer.json
      - name: Upload Unix installer assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-unix-installer
          path: dist-installer/*
          if-no-files-found: error
      - name: Upload Unix installer evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: evidence-unix-installer
          path: evidence/unix-installer.json
          if-no-files-found: error

  quality-gate:
    name: Quality gate
    needs:
      - benchmark
      - build
      - build-site
      - build-vscode
      - build-wasm
      - lint
      - sanitize
      - test
      - unix-installer
      - windows-installer
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Require every non-permitted result
        run: |
          python3 scripts/release.py quality-gate \
            --event "${{ github.event_name }}" \
            --job "benchmark=${{ needs.benchmark.result }}" \
            --job "build=${{ needs.build.result }}" \
            --job "site=${{ needs.build-site.result }}" \
            --job "vscode=${{ needs.build-vscode.result }}" \
            --job "wasm=${{ needs.build-wasm.result }}" \
            --job "lint=${{ needs.lint.result }}" \
            --job "sanitizer=${{ needs.sanitize.result }}" \
            --job "test=${{ needs.test.result }}" \
            --job "unix-installer=${{ needs.unix-installer.result }}" \
            --job "windows-installer=${{ needs.windows-installer.result }}" \
            --output evidence/quality-gate.json
      - name: Upload quality gate evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: evidence-quality-gate
          path: evidence/quality-gate.json
          if-no-files-found: error

  release:
    name: Aggregate release
    needs: quality-gate
    if: >-
      needs.quality-gate.result == 'success' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Download required release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          path: downloaded-assets
      - name: Download required evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: evidence-*
          path: downloaded-evidence
          merge-multiple: true
      - name: Assemble and verify the complete release
        run: |
          python3 scripts/release.py collect-assets --artifacts-root downloaded-assets --output release-assets
          python3 scripts/release.py finalize \
            --assets release-assets \
            --fragments downloaded-evidence \
            --commit "${{ github.sha }}" \
            --event "${{ github.event_name }}"
          cd release-assets
          sha256sum --check --strict SHA256SUMS
      - name: Upload complete release bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-release
          path: release-assets/*
          if-no-files-found: error
      - name: Create unstable prerelease
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          short_sha=${GITHUB_SHA:0:7}
          gh release create "unstable-$short_sha" \
            --target "$GITHUB_SHA" \
            --title "Unstable ($short_sha)" \
            --notes "Verified automated build from commit $GITHUB_SHA." \
            --prerelease \
            release-assets/*
      - name: Create stable draft release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/release.py stable-release \
            --tag "$GITHUB_REF_NAME" \
            --commit "$GITHUB_SHA" \
            --notes-output release-notes.md
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --target "$GITHUB_SHA" \
            --title "Lus ${GITHUB_REF_NAME#v}" \
            --draft \
            --notes-file release-notes.md \
            release-assets/*
