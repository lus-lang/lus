name: Release

# A release builds the interpreter for every supported platform, the
# embedding libraries, and lus.wasm from one runner, since Zig cross
# compiles each target. The VSCode extension and its Open VSX publisher
# are packaged on Linux, and the Windows installer is compiled and smoke
# tested on Windows. The tag must match the version in
# runtime/build.zig.zon. The release is created as a draft so a maintainer
# reviews it before publishing. Publishing it runs release-index.yml, which
# adds it to the signed index that `lus version` reads.
#
# The jobs run in this order:
#
#   1. build tests the commit and builds the file tree of every target
#      and lus.wasm, which it hands on as one tar file, so the modes of
#      the files survive.
#   2. sign-macos signs and notarizes the macOS binaries on Linux with
#      rcodesign. sign-windows signs the Windows binaries through Azure
#      Artifact Signing, then compiles, signs, and smoke tests
#      lus-setup.exe. Both run in the environment that `environment`
#      names, so one approval of a reviewer starts both.
#   3. package copies the signed files into the trees, then writes the
#      archives and attests them.
#
# A signing job signs only when the settings of its platform exist (see
# packaging/release/README.md). Without them it hands on the files as
# they were built, so a dry run and an unstable build work with no
# settings. A run in an environment stops when a setting is missing,
# since a release in an environment is a real release.
#
# nightly.yml calls this workflow in two ways. Each night it builds a
# canary of the development branch with the tag vX.Y.Z-dev, which is the
# version in build.zig.zon, and with `publish` false, so every artifact is
# built and tested and nothing is released. Once a week it calls it with a
# tag vX.Y.Z-unstable.N, where build.zig.zon holds X.Y.Z-dev. The binaries
# then report that version, and the release is published at once as a
# prerelease. A release tag also runs every job of full.yml before the
# release is created.
#
# ship.yml calls it with `patch`, the name of an artifact that holds the
# changes of the release commit. The jobs on Linux apply that patch to
# their checkout before they build. The installer takes its version from
# the tag. ship.yml also passes `publish` false, since it publishes
# the assets itself, and `environment` release for a real release.
#
# Every binary, link object, library, and archive gets a build provenance
# attestation, which `gh attestation verify FILE --repo lus-lang/lus`
# checks. A dry run of ship.yml and the nightly canary pass `attest`
# false, since each attestation is published to the transparency log of
# Sigstore.

on:
  push:
    tags: ["v2.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build, for example v2.0.0"
        required: true
  workflow_call:
    inputs:
      tag:
        description: "Tag to build, such as v2.0.0-unstable.7"
        required: true
        type: string
      publish:
        description: "Create the release. A canary build passes false."
        type: boolean
        default: true
      ref:
        description: "Commit or branch to build, or empty for the tag"
        type: string
        default: ""
      patch:
        description: "Artifact with the changes of the release commit, release.patch"
        required: false
        type: string
        default: ""
      attest:
        description: "Attest the provenance of the assets"
        required: false
        type: boolean
        default: true
      environment:
        description: "Environment of the signing jobs, which holds the signing settings, or empty for none"
        required: false
        type: string
        default: ""

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  ZIG_VERSION: "0.17.1"
  NODE_VERSION: "24.7.0"
  PNPM_VERSION: "10.18.0"
  TAG: ${{ inputs.tag || github.ref_name }}
  TARGETS: >-
    x86_64-linux-musl aarch64-linux-musl arm-linux-musleabihf
    riscv64-linux-musl loongarch64-linux-musl powerpc64le-linux-musl
    s390x-linux-musl x86_64-freebsd aarch64-freebsd x86_64-macos
    aarch64-macos x86_64-windows aarch64-windows
  # The signing tools, pinned by the SHA-256 digest of the file that each
  # release publishes.
  RCODESIGN_VERSION: "0.29.0"
  RCODESIGN_SHA256: "dbe85cedd8ee4217b64e9a0e4c2aef92ab8bcaaa41f20bde99781ff02e600002"
  JSIGN_VERSION: "7.6"
  JSIGN_SHA256: "6cf58aa080e7ff82656f320cff8d4a3bff30408df8766806dcba3740dd839fa5"

jobs:
  build:
    name: Build release artifacts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.ref || inputs.tag || github.ref }}
      - name: Download the release patch
        if: ${{ inputs.patch != '' && inputs.patch != null }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ inputs.patch }}
          path: ${{ runner.temp }}/patch
      - name: Apply the release patch
        if: ${{ inputs.patch != '' && inputs.patch != null }}
        shell: bash
        run: git apply "$RUNNER_TEMP/patch/release.patch"
      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Check the tag
        shell: bash
        run: |
          version="$(sed -n 's/^ *\.version = "\(.*\)",/\1/p' runtime/build.zig.zon)"
          # An unstable build of X.Y.Z-dev is tagged vX.Y.Z-unstable.N and
          # stamps that version into the binaries.
          if [[ "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)-unstable\.[0-9]+$ && "$version" == "${BASH_REMATCH[1]}-dev" ]]; then
            echo "VERSION_FLAG=-Dversion=${TAG#v}" >> "$GITHUB_ENV"
          elif [ "v$version" != "$TAG" ]; then
            echo "tag $TAG does not match build.zig.zon version $version" >&2
            exit 1
          else
            echo "VERSION_FLAG=" >> "$GITHUB_ENV"
          fi
      - name: Test before building
        working-directory: runtime
        run: |
          zig build test test-embed test-bundle test-check test-doc test-version -Doptimize=ReleaseSafe
          zig build -Doptimize=ReleaseSafe
          zig-out/bin/lus test ../tests/conformance ../packages/language-server/tests
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Test the Unix installer
        run: node --test packaging/install/install.test.mjs
      - name: Build every target
        working-directory: runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../dist
          for target in $TARGETS; do
            prefix="../out/$target"
            zig build -Doptimize=ReleaseFast -Dtarget="$target" $VERSION_FLAG --prefix "$prefix"
            zig build lib -Doptimize=ReleaseFast -Dtarget="$target" $VERSION_FLAG --prefix "$prefix"
            # `lus build --aot` links from the link object of the runtime
            # where the linker writes executables for the target, and
            # bundles on the prebuilt runtime elsewhere. It finds both next
            # to `lus` (spec/design/aot.md, "The executable" and "The link
            # object").
            zig build runtime -Doptimize=ReleaseFast -Dtarget="$target" $VERSION_FLAG --prefix "$prefix"
            case "$target" in
              *linux-musl* | *-macos | *-windows | x86_64-freebsd)
                zig build link-object -Doptimize=ReleaseFast -Dtarget="$target" $VERSION_FLAG --prefix "../out/lo-$target"
                cp "../out/lo-$target/lib/lus-runtime.lo" "$prefix/bin/lus-runtime.lo"
                ;;
            esac
            # The license of Lus and of every component compiled into the
            # archive ship at its root.
            cp ../LICENSE.md "$prefix/LICENSE.md"
            cp ../packaging/notices/THIRD_PARTY_NOTICES.NATIVE.md "$prefix/THIRD_PARTY_NOTICES.md"
            mkdir -p "$prefix/licenses"
            for license in BROTLI LUA MBEDTLS SQLITE TZDATA UNICODE ZIG ZSTD; do
              cp "../packaging/licenses/LICENSE.$license.txt" "$prefix/licenses/"
            done
            case "$target" in
              *linux-musl*) cp ../packaging/licenses/LICENSE.MUSL.txt "$prefix/licenses/" ;;
            esac
          done
          zig build wasm $VERSION_FLAG
          cp zig-out/wasm/lus.wasm ../dist/lus.wasm
          tar -C .. -cf "$RUNNER_TEMP/trees.tar" out dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned-trees
          path: ${{ runner.temp }}/trees.tar
          if-no-files-found: error

  sign-macos:
    name: Sign and notarize the macOS binaries
    needs: build
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.ref || inputs.tag || github.ref }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: unsigned-trees
          path: ${{ runner.temp }}/trees
      - name: Check the signing settings
        id: settings
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for name in APPLE_CERT_P12 APPLE_CERT_PASSWORD APPLE_API_KEY_P8 APPLE_API_KEY_ID APPLE_API_ISSUER; do
            if [ -z "${!name}" ]; then missing+=("$name"); fi
          done
          if [ "${#missing[@]}" -eq 0 ]; then
            echo "sign=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "sign=false" >> "$GITHUB_OUTPUT"
          if [ -n "$ENVIRONMENT" ]; then
            echo "::error::A release in the environment $ENVIRONMENT signs the macOS binaries, and ${missing[*]} is not set"
            exit 1
          fi
          echo "The macOS binaries stay unsigned, since ${missing[*]} is not set." >> "$GITHUB_STEP_SUMMARY"
      - name: Unpack the macOS trees
        shell: bash
        run: tar -xf "$RUNNER_TEMP/trees/trees.tar" out/x86_64-macos out/aarch64-macos
      - name: Install rcodesign
        if: steps.settings.outputs.sign == 'true'
        shell: bash
        run: |
          set -euo pipefail
          name="apple-codesign-$RCODESIGN_VERSION-x86_64-unknown-linux-musl"
          cd "$RUNNER_TEMP"
          curl -fsSL -o "$name.tar.gz" "https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign/$RCODESIGN_VERSION/$name.tar.gz"
          echo "$RCODESIGN_SHA256  $name.tar.gz" | sha256sum --check --strict
          tar -xzf "$name.tar.gz"
          install -m 755 "$name/rcodesign" /usr/local/bin/rcodesign
          rcodesign --version
      - name: Sign and notarize
        if: steps.settings.outputs.sign == 'true'
        env:
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        shell: bash
        run: |
          set -euo pipefail
          keys="$RUNNER_TEMP/apple"
          (umask 077 && mkdir -p "$keys" \
            && printf '%s' "$APPLE_CERT_P12" | base64 -d > "$keys/cert.p12" \
            && printf '%s' "$APPLE_CERT_PASSWORD" > "$keys/cert.password" \
            && printf '%s\n' "$APPLE_API_KEY_P8" > "$keys/api-key.p8")
          rcodesign encode-app-store-connect-api-key -o "$keys/api-key.json" "$APPLE_API_ISSUER" "$APPLE_API_KEY_ID" "$keys/api-key.p8"
          sign() {
            rcodesign sign --p12-file "$keys/cert.p12" --p12-password-file "$keys/cert.password" --for-notarization "$@"
          }
          mkdir -p "$RUNNER_TEMP/notarize"
          for target in x86_64-macos aarch64-macos; do
            # The JIT maps code writable and executable, which the hardened
            # runtime allows only with the entitlements of lus.entitlements.
            sign --binary-identifier dev.lus.lus --entitlements-xml-file packaging/release/lus.entitlements "out/$target/bin/lus"
            rcodesign verify "out/$target/bin/lus"
            mkdir -p "$RUNNER_TEMP/notarize/$target"
            cp "out/$target/bin/lus" "$RUNNER_TEMP/notarize/$target/"
            # lus-runtime stays as built, since `lus build` changes it and
            # signs the result ad hoc.
            for lib in "out/$target"/lib/*.dylib; do
              if [ -L "$lib" ]; then continue; fi
              sign --binary-identifier dev.lus.liblus "$lib"
              rcodesign verify "$lib"
              cp "$lib" "$RUNNER_TEMP/notarize/$target/"
            done
          done
          # Apple notarizes each signed binary in the zip. A bare binary
          # cannot hold a stapled ticket, so Gatekeeper looks the
          # notarization up online the first time it runs.
          (cd "$RUNNER_TEMP/notarize" && zip -qr ../notarize.zip .)
          rcodesign notary-submit --api-key-file "$keys/api-key.json" --wait --max-wait-seconds 1800 "$RUNNER_TEMP/notarize.zip"
          echo "The macOS binaries are signed and notarized." >> "$GITHUB_STEP_SUMMARY"
      - name: Remove the keys
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/apple"
      - name: Collect the macOS files
        shell: bash
        run: |
          set -euo pipefail
          for target in x86_64-macos aarch64-macos; do
            mkdir -p "signed/$target/bin" "signed/$target/lib"
            cp "out/$target/bin/lus" "signed/$target/bin/"
            for lib in "out/$target"/lib/*.dylib; do
              if [ ! -L "$lib" ]; then cp "$lib" "signed/$target/lib/"; fi
            done
          done
          find signed -type f
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signed-macos
          path: signed/
          if-no-files-found: error

  sign-windows:
    name: Sign the Windows binaries and build the installer
    needs: build
    runs-on: windows-2022
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.ref || inputs.tag || github.ref }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: unsigned-trees
          path: ${{ runner.temp }}/trees
      - name: Check the signing settings
        id: settings
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for name in AZURE_TENANT_ID AZURE_CLIENT_ID AZURE_SUBSCRIPTION_ID AZURE_SIGNING_ENDPOINT AZURE_SIGNING_ACCOUNT AZURE_SIGNING_PROFILE; do
            if [ -z "${!name}" ]; then missing+=("$name"); fi
          done
          if [ "${#missing[@]}" -eq 0 ]; then
            echo "sign=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "sign=false" >> "$GITHUB_OUTPUT"
          if [ -n "$ENVIRONMENT" ]; then
            echo "::error::A release in the environment $ENVIRONMENT signs the Windows binaries, and ${missing[*]} is not set"
            exit 1
          fi
          echo "The Windows binaries and lus-setup.exe stay unsigned, since ${missing[*]} is not set." >> "$GITHUB_STEP_SUMMARY"
      - name: Unpack the Windows trees
        shell: bash
        run: tar -xf "$RUNNER_TEMP/trees/trees.tar" out/x86_64-windows out/aarch64-windows
      - name: Log in to Azure
        if: steps.settings.outputs.sign == 'true'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Install jsign
        if: steps.settings.outputs.sign == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSL -o jsign.jar "https://github.com/ebourg/jsign/releases/download/$JSIGN_VERSION/jsign-$JSIGN_VERSION.jar"
          echo "$JSIGN_SHA256  jsign.jar" | sha256sum --check --strict
          java -jar jsign.jar --help > /dev/null
      - name: Sign lus.exe and lus.dll
        if: steps.settings.outputs.sign == 'true'
        env:
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # The access token lasts an hour, which covers the signatures of
          # this job, the installer's included.
          $token = az account get-access-token --resource https://codesigning.azure.net --query accessToken -o tsv
          if ($LASTEXITCODE -ne 0 -or -not $token) { throw "no access token for Artifact Signing" }
          Write-Output "::add-mask::$token"
          "AZURE_SIGNING_TOKEN=$token" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          $env:AZURE_SIGNING_TOKEN = $token
          $endpoint = ($env:AZURE_SIGNING_ENDPOINT -replace '^https://', '').TrimEnd('/')
          $sign = "java -jar $env:RUNNER_TEMP\jsign.jar --storetype TRUSTEDSIGNING --keystore $endpoint --storepass env:AZURE_SIGNING_TOKEN --alias $env:AZURE_SIGNING_ACCOUNT/$env:AZURE_SIGNING_PROFILE"
          "SIGN_COMMAND=$sign" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          # lus-runtime.exe stays as built, since `lus build` appends a
          # bundle to it, which a signature would not cover.
          foreach ($target in "x86_64-windows", "aarch64-windows") {
            foreach ($file in "out\$target\bin\lus.exe", "out\$target\bin\lus.dll") {
              if (-not (Test-Path $file)) { throw "$file is missing" }
              & java -jar "$env:RUNNER_TEMP\jsign.jar" --storetype TRUSTEDSIGNING --keystore $endpoint --storepass env:AZURE_SIGNING_TOKEN --alias "$env:AZURE_SIGNING_ACCOUNT/$env:AZURE_SIGNING_PROFILE" $file
              if ($LASTEXITCODE -ne 0) { throw "jsign failed on $file" }
              $status = (Get-AuthenticodeSignature $file).Status
              if ($status -ne "Valid") { throw "the signature of $file is $status" }
            }
          }
          "The Windows binaries and lus-setup.exe are signed." | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
      - name: Compile lus-setup.exe
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = $env:TAG.Substring(1)
          $numeric = ($version -split "-")[0]
          Copy-Item -Recurse out\x86_64-windows packaging\install\archive
          if (-not (Test-Path packaging\install\archive\bin\lus.exe)) {
            throw "the x86_64-windows tree has no bin\lus.exe"
          }
          $arguments = @("/DAppVer=$version", "/DNumVer=$numeric", "/O$env:GITHUB_WORKSPACE\dist")
          # With a sign tool, Inno Setup signs the uninstaller it embeds
          # and then lus-setup.exe. It puts the quoted path of each file
          # where the command has $f.
          if ($env:SIGN_COMMAND) { $arguments += @("/DSign", "/Slus=$env:SIGN_COMMAND `$f") }
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $compiler @arguments packaging\install\lus.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with $LASTEXITCODE" }
          if ($env:SIGN_COMMAND) {
            $status = (Get-AuthenticodeSignature dist\lus-setup.exe).Status
            if ($status -ne "Valid") { throw "the signature of lus-setup.exe is $status" }
          }
      - name: Silent install smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $setup = Start-Process -Wait -PassThru dist\lus-setup.exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/LOG=setup.log'
          if ($setup.ExitCode -ne 0) {
            Get-Content setup.log
            throw "setup exited with $($setup.ExitCode)"
          }
          $root = "$env:LOCALAPPDATA\lus"
          $version = $env:TAG.Substring(1)
          foreach ($file in "bin\lus.exe", "default", "versions\$version\bin\lus.exe", "versions\$version\channel", "versions\$version\include\lus.h", "versions\$version\LICENSE.md", "versions\$version\THIRD_PARTY_NOTICES.md") {
            if (-not (Test-Path "$root\$file")) {
              Get-Content setup.log
              throw "$file was not installed"
            }
          }
          if ($env:SIGN_COMMAND) {
            foreach ($file in "bin\lus.exe", "unins000.exe") {
              $status = (Get-AuthenticodeSignature "$root\$file").Status
              if ($status -ne "Valid") { throw "the signature of the installed $file is $status" }
            }
          }
          $reported = & "$root\bin\lus.exe" -v 2>&1
          if ("$reported" -notlike "*$($env:TAG.Substring(1))*") {
            throw "lus -v printed $reported"
          }
          Set-Content -Path hello.lus -Value 'print("installer-source-ok")'
          $output = & "$root\bin\lus.exe" hello.lus
          if ("$output" -ne "installer-source-ok") { throw "lus printed $output" }
          $userPath = (Get-ItemProperty HKCU:\Environment).Path
          if ($userPath -notlike "*\lus\bin*") {
            throw "user PATH was not updated: $userPath"
          }
          $env:LUS_HOME = $root
          $listed = & "$root\bin\lus.exe" version list --json | ConvertFrom-Json
          if ($listed.default -ne $version) { throw "lus version list reported $($listed.default)" }
      - name: Silent uninstall smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = "$env:LOCALAPPDATA\lus"
          Start-Process -Wait "$root\unins000.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES'
          # The uninstaller hands off to a copy of itself, so wait for the
          # files and the PATH entry to go.
          $deadline = (Get-Date).AddSeconds(90)
          while ($true) {
            $removed = -not (Test-Path "$root\bin\lus.exe")
            $userPath = (Get-ItemProperty HKCU:\Environment -ErrorAction SilentlyContinue).Path
            if ($removed -and ($userPath -notlike "*\lus\bin*")) { break }
            if ((Get-Date) -gt $deadline) { throw "uninstall did not complete" }
            Start-Sleep -Seconds 2
          }
      - name: Attest the installer
        if: ${{ inputs.attest != false }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/lus-setup.exe
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-windows-installer
          path: dist/lus-setup.exe
          if-no-files-found: error
      - name: Collect the Windows files
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($target in "x86_64-windows", "aarch64-windows") {
            New-Item -ItemType Directory -Force "signed\$target\bin" | Out-Null
            Copy-Item "out\$target\bin\lus.exe", "out\$target\bin\lus.dll" "signed\$target\bin\"
          }
          Get-ChildItem -Recurse -File signed | ForEach-Object { $_.FullName }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signed-windows
          path: signed/
          if-no-files-found: error

  package:
    name: Write and attest the archives
    needs: [sign-macos, sign-windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: unsigned-trees
          path: ${{ runner.temp }}/trees
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: signed-*
          path: ${{ runner.temp }}/signed
          merge-multiple: true
      - name: Write the archives
        shell: bash
        run: |
          set -euo pipefail
          tar -xf "$RUNNER_TEMP/trees/trees.tar"
          # Each signed file replaces the file as built. Copying onto the
          # existing file keeps its mode.
          (cd "$RUNNER_TEMP/signed" && find . -type f) | while read -r file; do
            test -f "out/$file"
            cp "$RUNNER_TEMP/signed/$file" "out/$file"
          done
          test -x out/aarch64-macos/bin/lus
          for target in $TARGETS; do
            name="lus-$TAG-$target"
            case "$target" in
              *windows*) (cd "out/$target" && zip -qr "../../dist/$name.zip" .) ;;
              *) tar -C "out/$target" -czf "dist/$name.tar.gz" . ;;
            esac
          done
          ls -l dist
      - name: Attest the binaries, link objects, and archives
        if: ${{ inputs.attest != false }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*
            out/*/bin/*
            out/*/lib/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-build
          path: dist/
          if-no-files-found: error

  vscode:
    name: Package the VSCode extension
    needs: package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.ref || inputs.tag || github.ref }}
          persist-credentials: false
      - name: Download the release patch
        if: ${{ inputs.patch != '' && inputs.patch != null }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ inputs.patch }}
          path: ${{ runner.temp }}/patch
      - name: Apply the release patch
        if: ${{ inputs.patch != '' && inputs.patch != null }}
        shell: bash
        run: git apply "$RUNNER_TEMP/patch/release.patch"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install pnpm
        run: npm install --global "pnpm@$PNPM_VERSION"
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-build
          path: release-build
      - name: Stage the release lus.wasm
        run: |
          mkdir -p packages/wasm/dist
          cp release-build/lus.wasm packages/wasm/dist/lus.wasm
      # Open VSX takes plain x.y.z versions, and publish-vscode.yml publishes
      # only stable tags, so a prerelease tag ships without the extension.
      - name: Package the VSIX and the Open VSX publisher
        if: ${{ startsWith(env.TAG, 'v') && !contains(env.TAG, '-') }}
        working-directory: packages/vscode
        run: |
          set -euo pipefail
          version="${TAG#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          out="$GITHUB_WORKSPACE/dist"
          mkdir -p "$out"
          npm pkg set "version=$version"
          pnpm typecheck
          pnpm test
          pnpm build
          pnpm check:package
          pnpm exec vsce package --no-dependencies --out "$out/lus-$version.vsix"
          publisher="$out/lus-$version-open-vsx-publisher.cjs"
          node scripts/build-open-vsx-publisher.mjs "$publisher"
          expected=$(node -p 'require("../../packaging/release/manifest.json").components.vscodePublisher.sha256')
          test "$(sha256sum "$publisher" | awk '{ print $1 }')" = "$expected"
          test "$(node "$publisher" --version)" = "$(node -p 'require("./package.json").devDependencies.ovsx')"
          ls -l "$out"
      - name: Attest the VSIX and its publisher
        if: ${{ inputs.attest != false && startsWith(env.TAG, 'v') && !contains(env.TAG, '-') }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ startsWith(env.TAG, 'v') && !contains(env.TAG, '-') }}
        with:
          name: release-vscode
          path: dist/
          if-no-files-found: error

  # Every check of full.yml runs before a release tag publishes. A call
  # from nightly.yml comes after that workflow ran full.yml itself.
  full:
    name: Full
    if: ${{ github.event_name == 'push' }}
    uses: ./.github/workflows/full.yml
    with:
      ref: ${{ github.ref }}
    secrets: inherit

  publish:
    name: Create the draft release
    needs: [package, vscode, sign-windows, full]
    if: ${{ !cancelled() && inputs.publish != false && needs.package.result == 'success' && needs.vscode.result == 'success' && needs.sign-windows.result == 'success' && (needs.full.result == 'success' || needs.full.result == 'skipped') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.ref || inputs.tag || github.ref }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Check the assets and write SHA256SUMS
        working-directory: dist
        shell: bash
        run: |
          set -euo pipefail
          diff <(sh ../packaging/release/assets.sh "$TAG" | sort) <(ls -1 | sort)
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - name: Extract the release notes
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$TAG" == *-unstable.* ]]; then
            printf 'An unstable build of %s.\n' "$GITHUB_SHA" > "$RUNNER_TEMP/notes.md"
            exit 0
          fi
          # The notes are the CHANGELOG.md section of this version, from
          # its "## VERSION" heading to the next "## " heading. A
          # prerelease tag such as v2.0.0-rc.1 uses the section of 2.0.0.
          version="${TAG#v}"
          extract() {
            awk -v v="$1" '
              /^## / {
                if (found) exit
                if ($0 == "## " v || index($0, "## " v " ") == 1) { found = 1; next }
              }
              found { print }
            ' CHANGELOG.md
          }
          notes="$(extract "$version")"
          if [[ -z "${notes//[[:space:]]/}" && "$version" == *-* ]]; then
            notes="$(extract "${version%%-*}")"
          fi
          if [[ -z "${notes//[[:space:]]/}" ]]; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi
          printf '%s\n' "$notes" > "$RUNNER_TEMP/notes.md"
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [[ "$TAG" == *-unstable.* ]]; then
            # A published release is immutable, so every asset is uploaded
            # while it is a draft.
            gh release create "$TAG" dist/* --draft --prerelease --verify-tag --title "Lus ${TAG#v}" --notes-file "$RUNNER_TEMP/notes.md"
            gh release edit "$TAG" --draft=false
          else
            gh release create "$TAG" dist/* --draft --verify-tag --title "Lus ${TAG#v}" --notes-file "$RUNNER_TEMP/notes.md"
          fi
