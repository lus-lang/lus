name: Release

# A release builds the interpreter for every supported platform, the
# embedding libraries, and lus.wasm from one runner, since Zig cross
# compiles each target. The VSCode extension and its Open VSX publisher
# are packaged on Linux, and the Windows installer is compiled and smoke
# tested on Windows. The tag must match the version in
# runtime/build.zig.zon. The release is created as a draft so a maintainer
# reviews it before publishing. Publishing it runs release-index.yml, which
# adds it to the signed index that `lus version` reads.
#
# nightly.yml calls this workflow in two ways. Each night it builds a
# canary of the development branch with the tag vX.Y.Z-dev, which is the
# version in build.zig.zon, and with `publish` false, so every artifact is
# built and tested and nothing is released. Once a week it calls it with a
# tag vX.Y.Z-unstable.N, where build.zig.zon holds X.Y.Z-dev. The binaries
# then report that version, and the release is published at once as a
# prerelease. A release tag also runs every job of full.yml before the
# release is created.
#
# ship.yml calls it with `patch`, the name of an artifact that holds the
# changes of the release commit, which the jobs on Linux apply to their
# checkout before they build, and with `publish` false, so ship.yml
# publishes the assets itself. The installer takes its version from the
# tag.

on:
  push:
    tags: ["v2.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build, for example v2.0.0"
        required: true
  workflow_call:
    inputs:
      tag:
        description: "Tag to build, such as v2.0.0-unstable.7"
        required: true
        type: string
      publish:
        description: "Create the release. A canary build passes false."
        type: boolean
        default: true
      ref:
        description: "Commit or branch to build, or empty for the tag"
        type: string
        default: ""
      patch:
        description: "Artifact with the changes of the release commit, release.patch"
        required: false
        type: string
        default: ""

permissions:
  contents: write

env:
  ZIG_VERSION: "0.17.1"
  NODE_VERSION: "24.7.0"
  PNPM_VERSION: "10.18.0"
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    name: Build release artifacts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.ref || inputs.tag || github.ref }}
      - name: Download the release patch
        if: ${{ inputs.patch != '' && inputs.patch != null }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ inputs.patch }}
          path: ${{ runner.temp }}/patch
      - name: Apply the release patch
        if: ${{ inputs.patch != '' && inputs.patch != null }}
        shell: bash
        run: git apply "$RUNNER_TEMP/patch/release.patch"
      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Check the tag
        shell: bash
        run: |
          version="$(sed -n 's/^ *\.version = "\(.*\)",/\1/p' runtime/build.zig.zon)"
          # An unstable build of X.Y.Z-dev is tagged vX.Y.Z-unstable.N and
          # stamps that version into the binaries.
          if [[ "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)-unstable\.[0-9]+$ && "$version" == "${BASH_REMATCH[1]}-dev" ]]; then
            echo "VERSION_FLAG=-Dversion=${TAG#v}" >> "$GITHUB_ENV"
          elif [ "v$version" != "$TAG" ]; then
            echo "tag $TAG does not match build.zig.zon version $version" >&2
            exit 1
          else
            echo "VERSION_FLAG=" >> "$GITHUB_ENV"
          fi
      - name: Test before building
        working-directory: runtime
        run: |
          zig build test test-embed test-bundle test-check test-doc test-version -Doptimize=ReleaseSafe
          zig build -Doptimize=ReleaseSafe
          zig-out/bin/lus test ../tests/conformance ../packages/language-server/tests
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Test the Unix installer
        run: node --test packaging/install/install.test.mjs
      - name: Build every target
        working-directory: runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../dist
          for target in x86_64-linux-musl aarch64-linux-musl arm-linux-musleabihf riscv64-linux-musl loongarch64-linux-musl powerpc64le-linux-musl s390x-linux-musl x86_64-freebsd aarch64-freebsd x86_64-macos aarch64-macos x86_64-windows aarch64-windows; do
            prefix="../out/$target"
            zig build -Doptimize=ReleaseFast -Dtarget="$target" $VERSION_FLAG --prefix "$prefix"
            zig build lib -Doptimize=ReleaseFast -Dtarget="$target" $VERSION_FLAG --prefix "$prefix"
            # `lus build --aot` links from the link object of the runtime
            # where the linker writes executables for the target, and
            # bundles on the prebuilt runtime elsewhere. It finds both next
            # to `lus` (spec/design/aot.md, "The executable" and "The link
            # object").
            zig build runtime -Doptimize=ReleaseFast -Dtarget="$target" $VERSION_FLAG --prefix "$prefix"
            case "$target" in
              *linux-musl* | *-macos | *-windows | x86_64-freebsd)
                zig build link-object -Doptimize=ReleaseFast -Dtarget="$target" $VERSION_FLAG --prefix "../out/lo-$target"
                cp "../out/lo-$target/lib/lus-runtime.lo" "$prefix/bin/lus-runtime.lo"
                ;;
            esac
            # The license of Lus and of every component compiled into the
            # archive ship at its root.
            cp ../LICENSE.md "$prefix/LICENSE.md"
            cp ../packaging/notices/THIRD_PARTY_NOTICES.NATIVE.md "$prefix/THIRD_PARTY_NOTICES.md"
            mkdir -p "$prefix/licenses"
            for license in BROTLI LUA MBEDTLS SQLITE TZDATA UNICODE ZIG ZSTD; do
              cp "../packaging/licenses/LICENSE.$license.txt" "$prefix/licenses/"
            done
            case "$target" in
              *linux-musl*) cp ../packaging/licenses/LICENSE.MUSL.txt "$prefix/licenses/" ;;
            esac
            name="lus-$TAG-$target"
            case "$target" in
              *windows*) (cd "$prefix" && zip -qr "../../dist/$name.zip" .) ;;
              *) tar -C "$prefix" -czf "../dist/$name.tar.gz" . ;;
            esac
          done
          zig build wasm $VERSION_FLAG
          cp zig-out/wasm/lus.wasm ../dist/lus.wasm
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-build
          path: dist/
          if-no-files-found: error

  vscode:
    name: Package the VSCode extension
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.ref || inputs.tag || github.ref }}
          persist-credentials: false
      - name: Download the release patch
        if: ${{ inputs.patch != '' && inputs.patch != null }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ inputs.patch }}
          path: ${{ runner.temp }}/patch
      - name: Apply the release patch
        if: ${{ inputs.patch != '' && inputs.patch != null }}
        shell: bash
        run: git apply "$RUNNER_TEMP/patch/release.patch"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install pnpm
        run: npm install --global "pnpm@$PNPM_VERSION"
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-build
          path: release-build
      - name: Stage the release lus.wasm
        run: |
          mkdir -p packages/wasm/dist
          cp release-build/lus.wasm packages/wasm/dist/lus.wasm
      # Open VSX takes plain x.y.z versions, and publish-vscode.yml publishes
      # only stable tags, so a prerelease tag ships without the extension.
      - name: Package the VSIX and the Open VSX publisher
        if: ${{ startsWith(env.TAG, 'v') && !contains(env.TAG, '-') }}
        working-directory: packages/vscode
        run: |
          set -euo pipefail
          version="${TAG#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          out="$GITHUB_WORKSPACE/dist"
          mkdir -p "$out"
          npm pkg set "version=$version"
          pnpm typecheck
          pnpm test
          pnpm build
          pnpm check:package
          pnpm exec vsce package --no-dependencies --out "$out/lus-$version.vsix"
          publisher="$out/lus-$version-open-vsx-publisher.cjs"
          node scripts/build-open-vsx-publisher.mjs "$publisher"
          expected=$(node -p 'require("../../packaging/release/manifest.json").components.vscodePublisher.sha256')
          test "$(sha256sum "$publisher" | awk '{ print $1 }')" = "$expected"
          test "$(node "$publisher" --version)" = "$(node -p 'require("./package.json").devDependencies.ovsx')"
          ls -l "$out"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ startsWith(env.TAG, 'v') && !contains(env.TAG, '-') }}
        with:
          name: release-vscode
          path: dist/
          if-no-files-found: error

  windows-installer:
    name: Build the Windows installer
    needs: build
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.ref || inputs.tag || github.ref }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-build
          path: release-build
      - name: Compile lus-setup.exe
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = $env:TAG.Substring(1)
          $numeric = ($version -split "-")[0]
          Expand-Archive "release-build\lus-$env:TAG-x86_64-windows.zip" packaging\install\archive
          if (-not (Test-Path packaging\install\archive\bin\lus.exe)) {
            throw "the x86_64-windows archive has no bin\lus.exe"
          }
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $compiler "/DAppVer=$version" "/DNumVer=$numeric" "/O$env:GITHUB_WORKSPACE\dist" packaging\install\lus.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with $LASTEXITCODE" }
      - name: Silent install smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $setup = Start-Process -Wait -PassThru dist\lus-setup.exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/LOG=setup.log'
          if ($setup.ExitCode -ne 0) {
            Get-Content setup.log
            throw "setup exited with $($setup.ExitCode)"
          }
          $root = "$env:LOCALAPPDATA\lus"
          $version = $env:TAG.Substring(1)
          foreach ($file in "bin\lus.exe", "default", "versions\$version\bin\lus.exe", "versions\$version\channel", "versions\$version\include\lus.h", "versions\$version\LICENSE.md", "versions\$version\THIRD_PARTY_NOTICES.md") {
            if (-not (Test-Path "$root\$file")) {
              Get-Content setup.log
              throw "$file was not installed"
            }
          }
          $reported = & "$root\bin\lus.exe" -v 2>&1
          if ("$reported" -notlike "*$($env:TAG.Substring(1))*") {
            throw "lus -v printed $reported"
          }
          Set-Content -Path hello.lus -Value 'print("installer-source-ok")'
          $output = & "$root\bin\lus.exe" hello.lus
          if ("$output" -ne "installer-source-ok") { throw "lus printed $output" }
          $userPath = (Get-ItemProperty HKCU:\Environment).Path
          if ($userPath -notlike "*\lus\bin*") {
            throw "user PATH was not updated: $userPath"
          }
          $env:LUS_HOME = $root
          $listed = & "$root\bin\lus.exe" version list --json | ConvertFrom-Json
          if ($listed.default -ne $version) { throw "lus version list reported $($listed.default)" }
      - name: Silent uninstall smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = "$env:LOCALAPPDATA\lus"
          Start-Process -Wait "$root\unins000.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES'
          # The uninstaller hands off to a copy of itself, so wait for the
          # files and the PATH entry to go.
          $deadline = (Get-Date).AddSeconds(90)
          while ($true) {
            $removed = -not (Test-Path "$root\bin\lus.exe")
            $userPath = (Get-ItemProperty HKCU:\Environment -ErrorAction SilentlyContinue).Path
            if ($removed -and ($userPath -notlike "*\lus\bin*")) { break }
            if ((Get-Date) -gt $deadline) { throw "uninstall did not complete" }
            Start-Sleep -Seconds 2
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-windows-installer
          path: dist/lus-setup.exe
          if-no-files-found: error

  # Every check of full.yml runs before a release tag publishes. A call
  # from nightly.yml comes after that workflow ran full.yml itself.
  full:
    name: Full
    if: ${{ github.event_name == 'push' }}
    uses: ./.github/workflows/full.yml
    with:
      ref: ${{ github.ref }}
    secrets: inherit

  publish:
    name: Create the draft release
    needs: [build, vscode, windows-installer, full]
    if: ${{ !cancelled() && inputs.publish != false && needs.build.result == 'success' && needs.vscode.result == 'success' && needs.windows-installer.result == 'success' && (needs.full.result == 'success' || needs.full.result == 'skipped') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.ref || inputs.tag || github.ref }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Check the assets and write SHA256SUMS
        working-directory: dist
        shell: bash
        run: |
          set -euo pipefail
          diff <(sh ../packaging/release/assets.sh "$TAG" | sort) <(ls -1 | sort)
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - name: Extract the release notes
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$TAG" == *-unstable.* ]]; then
            printf 'An unstable build of %s.\n' "$GITHUB_SHA" > "$RUNNER_TEMP/notes.md"
            exit 0
          fi
          # The notes are the CHANGELOG.md section of this version, from
          # its "## VERSION" heading to the next "## " heading. A
          # prerelease tag such as v2.0.0-rc.1 uses the section of 2.0.0.
          version="${TAG#v}"
          extract() {
            awk -v v="$1" '
              /^## / {
                if (found) exit
                if ($0 == "## " v || index($0, "## " v " ") == 1) { found = 1; next }
              }
              found { print }
            ' CHANGELOG.md
          }
          notes="$(extract "$version")"
          if [[ -z "${notes//[[:space:]]/}" && "$version" == *-* ]]; then
            notes="$(extract "${version%%-*}")"
          fi
          if [[ -z "${notes//[[:space:]]/}" ]]; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi
          printf '%s\n' "$notes" > "$RUNNER_TEMP/notes.md"
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [[ "$TAG" == *-unstable.* ]]; then
            gh release create "$TAG" dist/* --prerelease --verify-tag --title "Lus ${TAG#v}" --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "$TAG" dist/* --draft --verify-tag --title "Lus ${TAG#v}" --notes-file "$RUNNER_TEMP/notes.md"
          fi
