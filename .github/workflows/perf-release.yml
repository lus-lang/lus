name: Perf release

# Measures the benchmarks of each published stable release and stores the
# result on the perf-data branch as release/TAG.json, which the nightly
# run compares with (tools/ci/perf.mjs). A manual run measures a tag that
# was released earlier.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to measure, for example v2.0.0
        required: true

permissions:
  contents: read

jobs:
  measure:
    name: Measure the release
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.release.prerelease }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      TAG: ${{ inputs.tag || github.event.release.tag_name }}
    steps:
      - name: Get a token of the Lus app
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.LUS_APP_ID }}
          private-key: ${{ secrets.LUS_APP_PRIVATE_KEY }}
          permission-contents: write
      # The token of the app pushes the measurement to perf-data.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.TAG }}
          token: ${{ steps.app.outputs.token }}
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: "0.17.1"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.7.0"
      - name: Build
        working-directory: runtime
        run: zig build -Doptimize=ReleaseFast --prefix "$RUNNER_TEMP/lus"
      # The tools of the default branch measure every release the same way.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: tools-checkout
          persist-credentials: false
      - name: Measure
        timeout-minutes: 40
        run: node tools-checkout/tools/ci/perf.mjs run --lus "$RUNNER_TEMP/lus/bin/lus" --out "$RUNNER_TEMP/release.json"
      - name: Store
        run: sh tools-checkout/tools/ci/perf-store.sh "release/$TAG.json" "$RUNNER_TEMP/release.json"
