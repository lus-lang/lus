[tools]
zig = "0.17.1"
node = "24.7.0"
pnpm = "10.18.0"

[env]
# Every checkout and worktree shares one Zig cache, which
# tools/prune-zig-cache.sh keeps under its cap.
ZIG_GLOBAL_CACHE_DIR = "{{env.HOME}}/.cache/lus-zig/global"
ZIG_LOCAL_CACHE_DIR = "{{env.HOME}}/.cache/lus-zig/local"

[tasks.build]
description = "Build the Zig runtime"
dir = "runtime"
run = "sh ../tools/with-build-lock.sh zig build -j2 -Doptimize=ReleaseSafe"

[tasks.test]
description = "Run the runtime unit, embedding, tool, and conformance tests"
dir = "runtime"
run = [
  "zig build -j2 test test-embed test-bundle test-check test-doc test-debug test-version test-remote -Doptimize=ReleaseSafe",
  "zig build -j2 -Doptimize=ReleaseSafe",
  "zig-out/bin/lus test ../tests/conformance ../packages/language-server/tests",
  "LUS_JIT=off zig-out/bin/lus test ../tests/conformance ../packages/language-server/tests",
  "LUS_JIT=eager zig-out/bin/lus test ../tests/conformance ../packages/language-server/tests",
  "LUS_JIT=opt-eager zig-out/bin/lus test ../tests/conformance ../packages/language-server/tests",
  "zig-out/bin/lus test --doc ../packages/site/src/manual ../spec ../.agents",
]

[tasks."test:linux"]
description = "Run the conformance suite on Linux in the local Lima VM (LUS_LIMA_VM, default boring), on aarch64 and on x86-64 under qemu-user"
run = "sh tools/with-build-lock.sh sh tools/test-linux.sh"

[tasks."install:test"]
description = "Run install.sh against a local release built from runtime/zig-out"
depends = ["build"]
run = "node --test packaging/install/install.test.mjs"

[tasks.fuzz]
description = "Fuzz the front end, the chunk loader, and the parsers and formatters of the standard library"
dir = "runtime"
run = "sh ../tools/with-build-lock.sh zig build -j2 test --fuzz=1M -Doptimize=ReleaseSafe"

[tasks.diff]
description = "Run 200 generated programs under every JIT mode and compare their output"
depends = ["build"]
run = "LUS_JIT=off runtime/zig-out/bin/lus tests/diff/run.lus --count 200 --start 1 --jobs 4 --timeout 60"

[tasks."diff:long"]
description = "Generate programs until stopped, under every JIT mode and the gc-stress, x86-64, and WebAssembly builds"
depends = ["build", "build:stress", "build:x64", "wasm"]
run = "LUS_JIT=off runtime/zig-out/bin/lus tests/diff/run.lus --forever --reduce --jobs 8 --timeout 60 --stress runtime/zig-out-stress/bin/lus --x64 runtime/zig-out-x64/bin/lus --wasm packages/wasm/dist/lus.wasm"

[tasks."build:stress"]
description = "Build the gc-stress and gc-verify runtime into runtime/zig-out-stress"
dir = "runtime"
run = "sh ../tools/with-build-lock.sh zig build -j1 -Doptimize=ReleaseSafe -Dgc-stress=97 -Dgc-verify=true --prefix zig-out-stress"

[tasks."build:x64"]
description = "Build the runtime for x86-64 macOS into runtime/zig-out-x64, which runs under Rosetta"
dir = "runtime"
run = "sh ../tools/with-build-lock.sh zig build -j1 -Doptimize=ReleaseSafe -Dtarget=x86_64-macos --prefix zig-out-x64"

[tasks."build:oom"]
description = "Build the runtime with allocation failure injection into runtime/zig-out-oom"
dir = "runtime"
run = "sh ../tools/with-build-lock.sh zig build -j2 -Doptimize=ReleaseSafe -Dfail-alloc=true --prefix zig-out-oom"

[tasks."build:io"]
description = "Build the runtime with I/O fault injection into runtime/zig-out-io"
dir = "runtime"
run = "sh ../tools/with-build-lock.sh zig build -j2 -Doptimize=ReleaseSafe -Dfail-io=true --prefix zig-out-io"

[tasks.io]
description = "Fail and shorten sampled file and socket operations of every conformance test"
depends = ["build", "build:io"]
run = ["LUS_JIT=off runtime/zig-out/bin/lus tests/oom/run.lus --io --samples 20", "LUS_JIT=off runtime/zig-out/bin/lus tests/oom/run.lus --io --short --samples 5"]

[tasks.limits]
description = "Find every limit of the language and the runtime, and check it in every JIT mode and one past it"
depends = ["build"]
run = "LUS_JIT=off runtime/zig-out/bin/lus tests/limits/run.lus"

[tasks.corrupt]
description = "Truncate and flip every bit of seed inputs to every parser and decoder of the standard library, and report crashes and values that break their contract"
depends = ["build"]
run = "LUS_JIT=off runtime/zig-out/bin/lus tests/corrupt/run.lus --lus runtime/zig-out/bin/lus"

[tasks.faults]
description = "Fail each step of worker messages, each network operation, and each suspension of a detached coroutine, and script jumps of the real clock"
depends = ["build:io"]
run = [
    "LUS_JIT=off runtime/zig-out-io/bin/lus tests/faults/workers.lus --lus runtime/zig-out-io/bin/lus",
    "LUS_JIT=off runtime/zig-out-io/bin/lus tests/faults/network.lus --lus runtime/zig-out-io/bin/lus",
    "LUS_JIT=off runtime/zig-out-io/bin/lus tests/faults/cancel.lus --lus runtime/zig-out-io/bin/lus",
    "LUS_JIT=off runtime/zig-out-io/bin/lus tests/faults/clock.lus --lus runtime/zig-out-io/bin/lus",
]

[tasks.crash]
description = "Crash each durability sequence of the manual at every I/O operation with kills and simulated power losses"
depends = ["build:io"]
run = "LUS_JIT=off runtime/zig-out-io/bin/lus tests/crash/run.lus --lus runtime/zig-out-io/bin/lus"

[tasks.mutate]
description = "Sample mutants of the code that every program runs, build each, and report the ones that no test kills. MUTANTS sets the count (default 40), and a coverage run limits them to covered lines"
depends = ["build"]
run = [
  "if [ -d runtime/zig-out-cov/runs ]; then LUS_COVERAGE_REPORT=$PWD/runtime/zig-out-cov/runs LUS_COVERAGE_EXPORT=$PWD/runtime/zig-out-cov/covered.keys runtime/zig-out-cov/bin/lus > /dev/null; fi",
  "LUS_JIT=off runtime/zig-out/bin/lus tests/mutate/run.lus --count ${MUTANTS:-40} $([ -f runtime/zig-out-cov/covered.keys ] && echo --covered $PWD/runtime/zig-out-cov/covered.keys)",
]

[tasks."build:coverage"]
description = "Build the runtime as releases are built, ReleaseFast, with edge coverage into runtime/zig-out-cov"
dir = "runtime"
run = "sh ../tools/with-build-lock.sh zig build -j2 -Doptimize=ReleaseFast -Dcoverage=true -Dfail-alloc=true -Dfail-io=true --prefix zig-out-cov"

[tasks.coverage]
description = "Measure the branch coverage of src by the conformance suite in three JIT modes and the doc tests, and compare it with the baseline"
depends = ["build:coverage"]
dir = "runtime"
run = [
  "rm -rf zig-out-cov/runs && mkdir -p zig-out-cov/runs",
  "LUS_JIT=off LUS_BIN=$PWD/zig-out-cov/bin/lus LUS_COVERAGE=$PWD/zig-out-cov/runs zig-out-cov/bin/lus test ../tests/conformance ../packages/language-server/tests",
  "LUS_BIN=$PWD/zig-out-cov/bin/lus LUS_COVERAGE=$PWD/zig-out-cov/runs zig-out-cov/bin/lus test ../tests/conformance ../packages/language-server/tests",
  "LUS_JIT=opt-eager LUS_BIN=$PWD/zig-out-cov/bin/lus LUS_COVERAGE=$PWD/zig-out-cov/runs zig-out-cov/bin/lus test ../tests/conformance ../packages/language-server/tests",
  "LUS_BIN=$PWD/zig-out-cov/bin/lus LUS_COVERAGE=$PWD/zig-out-cov/runs zig-out-cov/bin/lus test --doc ../packages/site/src/manual ../spec ../.agents",
  "LUS_COVERAGE_REPORT=$PWD/zig-out-cov/runs zig-out-cov/bin/lus | tee zig-out-cov/report.txt",
  "LUS_JIT=off zig-out-cov/bin/lus ../tests/coverage/ratchet.lus zig-out-cov/report.txt ../tests/coverage/baseline.txt",
]

[tasks."coverage:sweeps"]
description = "Add the allocation and I/O failure sweeps to the last coverage run and print the report, as the nightly job does"
dir = "runtime"
run = [
  "LUS_JIT=off zig-out-cov/bin/lus ../tests/oom/run.lus --coverage $PWD/zig-out-cov/runs --lus zig-out-cov/bin/lus --samples 100 --jobs 4 --timeout 120 ../tests/conformance || true",
  "LUS_JIT=off zig-out-cov/bin/lus ../tests/oom/run.lus --coverage $PWD/zig-out-cov/runs --io --lus zig-out-cov/bin/lus --samples 40 --jobs 4 --timeout 120 ../tests/conformance || true",
  "LUS_COVERAGE_REPORT=$PWD/zig-out-cov/runs zig-out-cov/bin/lus | tee zig-out-cov/report-sweeps.txt",
]

[tasks."coverage:ratchet"]
description = "Store the last coverage report as the baseline that CI holds"
dir = "runtime"
run = "LUS_JIT=off zig-out-cov/bin/lus ../tests/coverage/ratchet.lus zig-out-cov/report.txt ../tests/coverage/baseline.txt --write"

[tasks."coverage:unit"]
description = "Run the unit tests, built with edge coverage, and export the source positions they cover for the merged report"
dir = "runtime"
run = [
  "zig build unit-binary -j2 -Dcoverage=true -Dfail-alloc=true -Dfail-io=true --prefix zig-out-cov",
  "rm -rf zig-out-cov/unit-runs && mkdir -p zig-out-cov/unit-runs",
  "LUS_COVERAGE=$PWD/zig-out-cov/unit-runs zig-out-cov/bin/lus-unit",
  "LUS_COVERAGE_REPORT=$PWD/zig-out-cov/unit-runs LUS_COVERAGE_EXPORT=$PWD/zig-out-cov/unit.keys zig-out-cov/bin/lus-unit > /dev/null",
]

[tasks."coverage:verify"]
description = "Run the conformance suite on a build that collects every 97th allocation and verifies the collector, with edge coverage, and export the source positions it covers"
dir = "runtime"
run = [
  "zig build -j1 -Doptimize=ReleaseFast -Dcoverage=true -Dgc-stress=97 -Dgc-verify=true --prefix zig-out-cov-verify",
  "rm -rf zig-out-cov-verify/runs && mkdir -p zig-out-cov-verify/runs",
  "LUS_JIT=off LUS_BIN=$PWD/zig-out-cov-verify/bin/lus LUS_COVERAGE=$PWD/zig-out-cov-verify/runs zig-out-cov-verify/bin/lus test ../tests/conformance ../packages/language-server/tests",
  "LUS_COVERAGE_REPORT=$PWD/zig-out-cov-verify/runs LUS_COVERAGE_EXPORT=$PWD/zig-out-cov/verify.keys zig-out-cov-verify/bin/lus > /dev/null",
]

[tasks."coverage:merged"]
description = "Print the report of the last coverage run with the positions that the unit tests and the verifying build cover"
dir = "runtime"
run = "LUS_COVERAGE_REPORT=$PWD/zig-out-cov/runs LUS_COVERAGE_MERGE=$PWD/zig-out-cov/unit.keys,$PWD/zig-out-cov/verify.keys zig-out-cov/bin/lus | tee zig-out-cov/report-merged.txt"

[tasks.mcdc]
description = "Measure the MC/DC of src: transform a copy of the runtime, build it, run the conformance suite in three JIT modes and the unit tests, and report the share of conditions shown to affect their decision"
dir = "runtime"
run = [
  "rm -rf zig-out-mcdc && mkdir -p zig-out-mcdc/runs && rsync -a --exclude .zig-cache --exclude 'zig-out*' ./ zig-out-mcdc/runtime/",
  "for d in spec .agents tests packages; do ln -s ../../$d zig-out-mcdc/$d; done",
  "zig run ../tests/coverage/mcdc/transform.zig -- zig-out-mcdc/runtime/src zig-out-mcdc/table.txt ../tests/coverage/mcdc/mcdc_rt.zig",
  "cd zig-out-mcdc/runtime && zig build -j2 -Doptimize=ReleaseFast",
  "LUS_JIT=off LUS_BIN=$PWD/zig-out-mcdc/runtime/zig-out/bin/lus LUS_MCDC=$PWD/zig-out-mcdc/runs zig-out-mcdc/runtime/zig-out/bin/lus test ../tests/conformance ../packages/language-server/tests",
  "LUS_BIN=$PWD/zig-out-mcdc/runtime/zig-out/bin/lus LUS_MCDC=$PWD/zig-out-mcdc/runs zig-out-mcdc/runtime/zig-out/bin/lus test ../tests/conformance ../packages/language-server/tests",
  "LUS_JIT=opt-eager LUS_BIN=$PWD/zig-out-mcdc/runtime/zig-out/bin/lus LUS_MCDC=$PWD/zig-out-mcdc/runs zig-out-mcdc/runtime/zig-out/bin/lus test ../tests/conformance ../packages/language-server/tests",
  "cd zig-out-mcdc/runtime && zig build unit-binary -j2",
  "LUS_MCDC=$PWD/zig-out-mcdc/runs zig-out-mcdc/runtime/zig-out/bin/lus-unit > /dev/null",
  "LUS_JIT=off zig-out-mcdc/runtime/zig-out/bin/lus ../tests/coverage/mcdc/mcdc.lus zig-out-mcdc/table.txt zig-out-mcdc/runs | tee zig-out-mcdc/report.txt",
]

[tasks."build:sanitize"]
description = "Build the runtime with the vendored C libraries under the undefined behavior sanitizer into runtime/zig-out-ubsan"
dir = "runtime"
run = "sh ../tools/with-build-lock.sh zig build -j2 -Doptimize=ReleaseSafe -Dsanitize-c=true --prefix zig-out-ubsan"

[tasks.sanitize]
description = "Run the conformance suite and the fuzz targets with the vendored C libraries under the undefined behavior sanitizer"
depends = ["build:sanitize"]
dir = "runtime"
run = [
  "zig-out-ubsan/bin/lus test ../tests/conformance",
  "zig build -j2 test --fuzz=200K -Doptimize=ReleaseSafe -Dsanitize-c=true",
]

[tasks.oom]
description = "Fail sampled allocations of every conformance test and check for crashes, leaks, and hangs"
depends = ["build", "build:oom"]
run = "LUS_JIT=off runtime/zig-out/bin/lus tests/oom/run.lus --samples 8"

[tasks."oom:long"]
description = "Fail 400 sampled allocations of every conformance test, once and from that point on"
depends = ["build", "build:oom"]
run = ["LUS_JIT=off runtime/zig-out/bin/lus tests/oom/run.lus --samples 400", "LUS_JIT=off runtime/zig-out/bin/lus tests/oom/run.lus --samples 100 --sticky"]

[tasks.wasm]
description = "Build lus.wasm for wasm32-wasi into packages/wasm/dist"
dir = "runtime"
run = [
  "sh ../tools/wait-for-memory.sh",
  "zig build -j1 wasm",
  "mkdir -p ../packages/wasm/dist",
  "cp zig-out/wasm/lus.wasm ../packages/wasm/dist/lus.wasm",
]

[tasks."wasm:test"]
description = "Run the lus.wasm host tests"
depends = ["wasm"]
dir = "packages/wasm"
run = "node --test"

[tasks."wasm:conformance"]
description = "Run the conformance tests on lus.wasm with the JIT off, on, and eager"
depends = ["wasm"]
dir = "packages/wasm"
run = "node scripts/conformance.mjs --modes off,on,eager"

[tasks."wasm:bench"]
description = "Time the benchmarks on lus.wasm with the JIT off and on"
depends = ["wasm"]
dir = "packages/wasm"
run = "node bench/run.mjs"

[tasks.gen]
description = "Regenerate LSP stdlib data and TextMate grammars from spec/"
run = "pnpm run gen"

[tasks."gen:check"]
description = "Fail if generated files are out of date"
run = ["pnpm run test:tools", "pnpm run gen:check"]

[tasks."gen:tzdata"]
description = "Rebuild the embedded IANA tzdata from the pinned release"
run = "node tools/gen-tzdata.js"

[tasks."gen:winzones"]
description = "Regenerate the Windows to IANA zone table from the pinned CLDR release"
run = "node tools/gen-winzones.js"

[tasks.install]
description = "Install JavaScript workspace dependencies"
run = "pnpm install --frozen-lockfile"

[tasks.site]
description = "Build the website"
depends = ["install"]
run = "pnpm --filter ./packages/site build"

[tasks.vscode]
description = "Build the VSCode extension"
depends = ["install"]
run = "pnpm --filter ./packages/vscode build"

[tasks.lint]
description = "Repository prose and naming checks"
run = ["node tools/lint-repo.js", "cd runtime && zig fmt --check src build.zig"]
