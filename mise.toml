[tools]
zig = "0.17.1"
node = "24.7.0"
pnpm = "10.18.0"
python = "3.12"

[env]
ZIG_GLOBAL_CACHE_DIR = "{{config_root}}/runtime/.zig-cache/global"

[tasks.build]
description = "Build the Zig runtime"
dir = "runtime"
run = "zig build -Doptimize=ReleaseSafe"

[tasks.test]
description = "Run the runtime unit, embedding, tool, and conformance tests"
dir = "runtime"
run = [
  "zig build test test-embed test-bundle test-check test-doc -Doptimize=ReleaseSafe",
  "zig build -Doptimize=ReleaseSafe",
  "zig-out/bin/lus test ../tests/conformance ../packages/language-server/tests",
]

[tasks.wasm]
description = "Build lus.wasm for wasm32-wasi into packages/wasm/dist"
dir = "runtime"
run = [
  "zig build wasm",
  "mkdir -p ../packages/wasm/dist",
  "cp zig-out/wasm/lus.wasm ../packages/wasm/dist/lus.wasm",
]

[tasks."wasm:test"]
description = "Run the lus.wasm host tests"
depends = ["wasm"]
dir = "packages/wasm"
run = "node --test"

[tasks.gen]
description = "Regenerate LSP stdlib data and TextMate grammars from spec/"
run = "pnpm run gen"

[tasks."gen:check"]
description = "Fail if generated files are out of date"
run = ["pnpm run test:tools", "pnpm run gen:check"]

[tasks.install]
description = "Install JavaScript workspace dependencies"
run = "pnpm install --frozen-lockfile"

[tasks.site]
description = "Build the website"
depends = ["install"]
run = "pnpm --filter ./packages/site build"

[tasks.vscode]
description = "Build the VSCode extension"
depends = ["install"]
run = "pnpm --filter ./packages/vscode build"

[tasks."legacy:build"]
description = "Build the frozen 1.7 C runtime (differential oracle)"
dir = "legacy/lus"
run = ["meson setup build --reconfigure", "meson compile -C build"]

[tasks."legacy:test"]
description = "Run the frozen 1.7 runtime's H1 and H2 suites"
depends = ["legacy:build"]
dir = "legacy/lus"
run = "meson test -C build --suite h1 --suite h2"

[tasks.lint]
description = "Repository prose and naming checks"
run = "node tools/lint-repo.js"
